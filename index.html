":"awkward","t":"Awkward moments","s":"You realize you misunderstood someone's question","r":"Ah, I see what you meant now. Let me answer that version."},{"id":"c199","d":"awkward","t":"Awkward moments","s":"You have nothing useful to add","r":"That's helpful context. I'll give it some thought."},{"id":"c200","d":"awkward","t":"Awkward moments","s":"You run out of small talk after a minute","r":"Well, it was nice catching up. Hope the rest of your day goes well."},{"id":"c201","d":"awkward","t":"Awkward moments","s":"Someone gives a very short answer","r":"Got it. Hope your day goes smoothly!","tip":"Don't force more questions."},{"id":"c202","d":"awkward","t":"Awkward moments","s":"You say something too blunt","r":"Let me rephrase that. What I meant was..."},{"id":"c203","d":"awkward","t":"Awkward moments","s":"You make an incorrect assumption","r":"Thanks for clarifying. I shouldn't have assumed that."},{"id":"c204","d":"awkward","t":"Awkward moments","s":"You cannot remember where you met someone","r":"Remind me where we first crossed paths?"},{"id":"c205","d":"awkward","t":"Awkward moments","s":"Someone is visibly upset but has not said why","r":"You seem like you have a lot on your plate. Anything I can help with?"},{"id":"c206","d":"awkward","t":"Awkward moments","s":"A colleague shares sad personal news","r":"I'm really sorry to hear that. Thinking of you and your family."},{"id":"c207","d":"awkward","t":"Awkward moments","s":"You do not want to answer a personal question","r":"I tend to keep that part of my life private, but I appreciate you asking."},{"id":"c208","d":"awkward","t":"Awkward moments","s":"Someone starts gossiping about another coworker","r":"I don't know the full context, so I'd rather not speculate."},{"id":"c209","d":"awkward","t":"Awkward moments","s":"You need to correct yourself after giving bad information","r":"I need to correct something I said earlier. The updated figure is..."},{"id":"c262","d":"feedback","t":"Feedback and conflict","s":"Someone gives you constructive criticism","r":"Thanks for being direct. Could you share an example so I can improve?"},{"id":"c263","d":"feedback","t":"Feedback and conflict","s":"You need to give constructive feedback","r":"One thing that could make this even stronger is..."},{"id":"c264","d":"feedback","t":"Feedback and conflict","s":"A teammate misses a commitment","r":"I wanted to check in on the deliverable. Is anything blocking progress?"},{"id":"c265","d":"feedback","t":"Feedback and conflict","s":"You feel your contribution was overlooked","r":"I wanted to add a little context on the analysis I completed for that workstream."},{"id":"c266","d":"feedback","t":"Feedback and conflict","s":"You need to set a boundary around workload","r":"I can take that on, but which of my current priorities should move down?"},{"id":"c267","d":"feedback","t":"Feedback and conflict","s":"Someone disagrees with your analysis","r":"That's fair. Let's compare the assumptions and see where our views differ."},{"id":"c268","d":"feedback","t":"Feedback and conflict","s":"You realize your feedback came across harshly","r":"I want to revisit how I phrased that. I meant to focus on the work, not criticize you."},{"id":"c269","d":"feedback","t":"Feedback and conflict","s":"A coworker seems defensive","r":"I may not have explained my point clearly. My goal is to find a workable solution."},{"id":"c270","d":"feedback","t":"Feedback and conflict","s":"You need to push back on a vague request","r":"Could we define what a successful output would look like before I start?"},{"id":"c271","d":"feedback","t":"Feedback and conflict","s":"You need to escalate a blocker professionally","r":"We've tried [steps], but the dependency remains unresolved. Could you help identify an owner?"},{"id":"c272","d":"feedback","t":"Feedback and conflict","s":"You want to repair tension after a disagreement","r":"I appreciated the discussion earlier. I hope we can keep working through it constructively."},{"id":"c273","d":"feedback","t":"Feedback and conflict","s":"You are asked to share confidential details","r":"I'm not able to share that information, but I can direct you to the appropriate owner."},{"id":"c274","d":"feedback","t":"Feedback and conflict","s":"You want to recognize a teammate's help","r":"Your input made a real difference in getting this done. Thank you."},{"id":"c275","d":"feedback","t":"Feedback and conflict","s":"You want to say no to an optional meeting","r":"Thanks for including me. I don't think I need to attend, but please send any action items for my team."},{"id":"c276","d":"feedback","t":"Feedback and conflict","s":"You need to own a mistake","r":"I missed that detail. I'll correct it and share the updated version by [time]."},{"id":"c356","d":"feedback","t":"Social boundaries","s":"A coworker repeatedly interrupts your focus time","r":"I'm heads-down on a deadline right now. Could we catch up later?"},{"id":"c357","d":"feedback","t":"Social boundaries","s":"Someone asks you to join an after-work event","r":"Thanks for the invite! I can't make it this time, but I appreciate you including me."},{"id":"c358","d":"feedback","t":"Social boundaries","s":"Someone asks for details about your salary","r":"I prefer to keep compensation discussions private."},{"id":"c359","d":"feedback","t":"Social boundaries","s":"Someone asks you to discuss a rumor","r":"I haven't heard anything confirmed, so I'd rather not speculate."},{"id":"c360","d":"feedback","t":"Social boundaries","s":"Someone keeps asking personal questions","r":"I'd rather keep that private. How's the project going, by the way?"},{"id":"c361","d":"feedback","t":"Social boundaries","s":"A coworker sends messages late at night","r":"Thanks for sending this. I'll review it during working hours tomorrow."},{"id":"c362","d":"feedback","t":"Social boundaries","s":"You need to end a conversation politely but quickly","r":"I need to get back to something time-sensitive. Good talking with you!"},{"id":"c363","d":"feedback","t":"Social boundaries","s":"You want to disagree without sounding dismissive","r":"I see the value in that idea. My concern is [specific issue]."},{"id":"c364","d":"feedback","t":"Social boundaries","s":"Someone makes an inappropriate joke","r":"I'd rather keep things professional. Let's move back to the topic."},{"id":"c365","d":"feedback","t":"Social boundaries","s":"Someone asks you to share restricted information","r":"I'm not able to share that. The appropriate owner can advise on access."},{"id":"c338","d":"support","t":"Celebrations and support","s":"A coworker gets engaged","r":"Congratulations! That's exciting news."},{"id":"c339","d":"support","t":"Celebrations and support","s":"A coworker announces a new baby","r":"Congratulations to you and your family! Wishing you all the best."},{"id":"c340","d":"support","t":"Celebrations and support","s":"A coworker finishes a certification","r":"That's a big accomplishment. Congratulations!"},{"id":"c341","d":"support","t":"Celebrations and support","s":"A coworker is moving to a new team","r":"Congrats on the new opportunity! We'll miss having you around."},{"id":"c342","d":"support","t":"Celebrations and support","s":"A teammate is leaving the company","r":"I've really enjoyed working with you. Wishing you the best in what's next."},{"id":"c343","d":"support","t":"Celebrations and support","s":"A coworker has a birthday","r":"Happy birthday! Hope you have a great day."},{"id":"c344","d":"support","t":"Celebrations and support","s":"Someone has a difficult personal situation","r":"I'm sorry you're dealing with that. Please don't feel you have to explain more."},{"id":"c345","d":"support","t":"Celebrations and support","s":"Someone returns after bereavement leave","r":"It's good to see you. No pressure to catch up right away."},{"id":"c346","d":"support","t":"Celebrations and support","s":"A teammate has been working late repeatedly","r":"You've been carrying a lot lately. Is there anything I can take off your plate?"},{"id":"c347","d":"support","t":"Celebrations and support","s":"A coworker has a major project success","r":"Great work on that launch. The effort really showed."},{"id":"c348","d":"support","t":"Inclusion","s":"You are unsure how to pronounce a name","r":"Could you tell me how you pronounce your name? I want to get it right."},{"id":"c349","d":"support","t":"Inclusion","s":"You meet someone with a different communication style","r":"I'd like to make sure we're on the same page. What approach works best for you?"},{"id":"c350","d":"support","t":"Inclusion","s":"A coworker doesn't celebrate a holiday you mention","r":"Thanks for letting me know. Hope you have a good week either way."},{"id":"c351","d":"support","t":"Inclusion","s":"You are making plans and want to be inclusive","r":"Would this time and format work for everyone?"},{"id":"c352","d":"support","t":"Inclusion","s":"Someone speaks more slowly or is searching for words","r":"Take your time. I'm listening."},{"id":"c353","d":"support","t":"Inclusion","s":"You need to check accessibility needs for a session","r":"Is there anything we can adjust to make the session easier to participate in?"},{"id":"c354","d":"support","t":"Inclusion","s":"You realize you used an unfamiliar acronym","r":"Sorry, that stands for [term]. I should have spelled it out."},{"id":"c355","d":"support","t":"Inclusion","s":"You are unsure whether a topic is too personal","r":"How's your week been outside of work?","tip":"Keep the question optional and general."}]}</script>
<script type="application/json" id="my-cards">[]</script>
<script id="app-script">
(function () {
  'use strict';

  // Kept identical to the top of this file so the page can republish itself when cards are added.
  var HEAD_MARKUP = '<title>Workplace Social Fluency</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">';
  var SHELL = '<div id="app"></div>\n<div id="sheet-root"></div>\n<div id="toast" role="status" aria-live="polite"></div>';

  function $(sel) { return document.querySelector(sel); }
  var DATA = JSON.parse($('#deck-data').textContent);
  var EMBED = [];
  try { var parsed = JSON.parse($('#my-cards').textContent); if (Array.isArray(parsed)) EMBED = parsed; } catch (e) {}

  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var K = { prog: 'wsf.progress.v1', mine: 'wsf.mine.v1', name: 'wsf.name.v1' };
  var prog = store.get(K.prog, {}) || {};
  var myName = String(store.get(K.name, 'Alex') || 'Alex');
  var embIds = new Set(EMBED.map(function (c) { return c.id; }));
  var localMine = (store.get(K.mine, []) || []).filter(function (c) { return c && c.id && c.s; });
  if (localMine.some(function (c) { return embIds.has(c.id); })) {
    localMine = localMine.filter(function (c) { return !embIds.has(c.id); });
    store.set(K.mine, localMine);
  }

  var MINE = { id: 'mine', name: 'My cards', hue: 60 };
  var CARDS = [], BYID = new Map();
  function rebuild() {
    var mine = EMBED.concat(localMine).map(function (c) { return Object.assign({}, c, { mine: 1 }); });
    CARDS = DATA.cards.concat(mine);
    BYID = new Map(CARDS.map(function (c) { return [c.id, c]; }));
  }
  rebuild();
  function deckList() { return CARDS.some(function (c) { return c.d === 'mine'; }) ? DATA.decks.concat([MINE]) : DATA.decks; }
  function deck(id) { return DATA.decks.find(function (d) { return d.id === id; }) || MINE; }
  function idsIn(id) { return CARDS.filter(function (c) { return c.d === id; }).map(function (c) { return c.id; }); }
  function allIds() { return CARDS.map(function (c) { return c.id; }); }
  function isAdv(c) { return deck(c.d).lvl === 'adv'; }
  function advIds() { return CARDS.filter(isAdv).map(function (c) { return c.id; }); }
  function inFilter(c, f) { return f === 'all' || (f === 'adv' ? isAdv(c) : f === 'core' ? !isAdv(c) : c.d === f); }

  // Text
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]; }); }
  function nameSwap(s) { return myName && myName !== 'Alex' ? String(s).replace(/\bAlex\b/g, myName) : String(s); }
  function rich(s, q) {
    s = nameSwap(s);
    var out;
    if (q) {
      var re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      out = s.split(re).map(function (part, i) { return i % 2 ? '<mark>' + esc(part) + '</mark>' : esc(part); }).join('');
    } else {
      out = esc(s);
    }
    return out.replace(/\[([^\]]+)\]/g, '<span class="fill">$1</span>');
  }
  function pct(a, b) { return b ? Math.round(a * 1000 / b) / 10 : 0; }

  var ICON = {
    back: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>',
    shuffle: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>'
  };

  // Progress: box 0 new, 1 still learning, 2 got it once, 3 got it twice or more.
  var DAY = 864e5;
  function box(id) { return (prog[id] && prog[id].b) || 0; }
  function priority(id) {
    var p = prog[id];
    if (!p) return 1;
    if (p.b === 1) return 0;
    var age = (Date.now() - (p.t || 0)) / DAY;
    if (p.b === 2) return age > 1 ? 2 : 4;
    return age > 4 ? 3 : 5;
  }
  function ordered(ids) {
    return ids.map(function (id) { return [priority(id) + Math.random() * 0.9, id]; })
      .sort(function (a, b) { return a[0] - b[0]; })
      .map(function (x) { return x[1]; });
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function stats(ids) {
    var k = 0, l = 0;
    ids.forEach(function (id) { var b = box(id); if (b >= 2) k++; else if (b === 1) l++; });
    return { k: k, l: l, n: ids.length };
  }
  function todayCard() {
    var d = new Date();
    var n = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
    var pool = DATA.cards.filter(isAdv);
    if (!pool.length) pool = DATA.cards;
    return pool[(n * 37) % pool.length];
  }

  // State
  var ui = { view: 'home', reveal: false, q: '', filter: 'all', confirmDel: null };
  var S = null;
  var app = $('#app');

  function go(view) {
    ui.view = view;
    document.body.classList.toggle('studying', view === 'study' || view === 'done');
    render();
    window.scrollTo(0, 0);
    try { history.replaceState(null, '', view === 'book' ? '#phrasebook' : '#decks'); } catch (e) {}
  }
  function render() {
    if (ui.view === 'study') { app.innerHTML = studyView(); bindCard(); }
    else if (ui.view === 'done') app.innerHTML = doneView();
    else if (ui.view === 'book') { app.innerHTML = header() + bookView(); renderRows(); }
    else app.innerHTML = header() + homeView();
  }

  function header() {
    return '<header class="top"><div class="wrap">' +
      '<button class="brand" data-act="home" aria-label="Workplace Social Fluency, decks">' +
        '<span class="mark" aria-hidden="true"><i></i><i></i></span>' +
        '<span class="brand-name">Workplace Social Fluency<span class="brand-sub">' + CARDS.length + ' moments and what to say in each</span></span>' +
      '</button>' +
      '<nav class="tabs" aria-label="Views">' +
        '<button class="tab" data-act="home"' + (ui.view === 'home' ? ' aria-current="page"' : '') + '>Decks</button>' +
        '<button class="tab" data-act="book"' + (ui.view === 'book' ? ' aria-current="page"' : '') + '>Phrasebook</button>' +
      '</nav>' +
      '<button class="add-btn" data-act="add">' + ICON.plus + '<span>Add card</span></button>' +
    '</div></header>';
  }

  function answerHTML(c) {
    var len = (c.r || '').length + (c.tip || '').length * 0.6 + (c.alt ? 30 : 0);
    var size = len > 150 ? ' long' : len > 95 ? ' mid' : '';
    return (c.r ? '<p class="say' + size + '">' + rich(c.r) + '</p>' : '') +
      (c.tip ? '<p class="tip' + (c.r ? '' : ' solo') + '"><b>Tip</b><span>' + rich(c.tip) + '</span></p>' : '') +
      (c.alt ? '<div><span class="ex-k">Or</span><p class="alt">' + rich(c.alt) + '</p></div>' : '') +
      (c.f ? '<p class="follow"><span class="ex-if">If ' + rich(c.f.if) + '</span>' + rich(c.f.say) + '</p>' : '') +
      (c.why ? '<p class="why"><b>Why it works</b>' + rich(c.why) + '</p>' : '');
  }

  function homeView() {
    var all = allIds();
    var st = stats(all);
    var learning = all.filter(function (id) { return box(id) === 1; }).length;
    var today = todayCard();
    var td = deck(today.d);
    var adv = advIds();
    var sa = stats(adv), sc = stats(all.filter(function (id) { return !isAdv(BYID.get(id)); }));
    function tile(d) {
      var s = stats(idsIn(d.id));
      return '<button class="deck' + (d.lvl === 'adv' ? ' deep' : '') + '" data-act="deck" data-deck="' + d.id + '" style="--h:' + d.hue + '">' +
        '<span class="deck-tab">' + s.n + ' cards</span>' +
        '<span class="deck-name">' + esc(d.name) + '</span>' +
        '<span class="deck-meter" aria-hidden="true"><span class="k" style="width:' + pct(s.k, s.n) + '%"></span><span class="l" style="width:' + pct(s.l, s.n) + '%"></span></span>' +
        '<span class="deck-foot">' + (s.k ? s.k + ' down' : 'Not started') + (s.l ? ' · ' + s.l + ' learning' : '') + '</span>' +
      '</button>';
    }
    var advTiles = deckList().filter(function (d) { return d.lvl === 'adv'; }).map(tile).join('');
    var coreTiles = deckList().filter(function (d) { return d.lvl !== 'adv'; }).map(tile).join('');
    return '<main class="wrap home">' +
      '<section class="today">' +
        '<article class="moment" style="--h:' + td.hue + '">' +
          '<p class="eyebrow">Today’s moment · ' + esc(td.name) + '</p>' +
          '<p class="scenario">' + rich(today.s) + '</p>' +
          (ui.reveal ? answerHTML(today) : '<button class="btn" data-act="reveal">Show what to say</button>') +
        '</article>' +
        '<aside class="panel">' +
          '<div class="tally"><b>' + st.k + '</b><span>of ' + st.n + ' down</span></div>' +
          '<div class="stack" role="img" aria-label="' + st.k + ' down, ' + st.l + ' still learning, ' + (st.n - st.k - st.l) + ' not seen yet"><span class="k" style="width:' + pct(st.k, st.n) + '%"></span><span class="l" style="width:' + pct(st.l, st.n) + '%"></span></div>' +
          '<div class="legend"><span><i style="background:var(--good)"></i>' + st.k + ' down</span><span><i style="background:var(--learn)"></i>' + st.l + ' learning</span><span><i style="background:var(--line)"></i>' + (st.n - st.k - st.l) + ' new</span></div>' +
          '<div class="tiers"><div><span>Advanced</span><span>' + sa.k + ' / ' + sa.n + '</span></div><div><span>Essentials</span><span>' + sc.k + ' / ' + sc.n + '</span></div></div>' +
          '<div class="actions">' +
            (adv.length ? '<button class="btn primary" data-act="quick-adv">Quick 10: advanced</button>' : '') +
            '<button class="btn' + (adv.length ? '' : ' primary') + '" data-act="quick">Quick 10 from everything</button>' +
            (learning ? '<button class="btn" data-act="learning">Review the ' + learning + ' I’m still learning</button>' : '') +
            '<button class="btn ghost" data-act="shuffle-all">Shuffle everything</button>' +
          '</div>' +
        '</aside>' +
      '</section>' +
      (advTiles ? '<section class="tier">' +
        '<div class="section-head"><h2>Advanced</h2><span class="muted">' + sa.n + ' cards</span></div>' +
        '<p class="tier-note">High-stakes moments with senior leaders, pushback, influence and recovery. Each card has a second way to say it, what to do if they push back, and why it works.</p>' +
        '<div class="decks">' + advTiles + '</div>' +
      '</section>' : '') +
      '<section class="tier">' +
        '<div class="section-head"><h2>Essentials</h2><span class="muted">' + sc.n + ' cards</span></div>' +
        '<p class="tier-note">Everyday basics from your original list.</p>' +
        '<div class="decks">' + coreTiles + '</div>' +
      '</section>' +
      '<details class="howto"><summary>How to practice</summary><ol>' +
        '<li>Read the moment and say your own answer out loud before you flip.</li>' +
        '<li>Compare it with the suggestion. Aim for warmth, clarity and timing, not word for word recall.</li>' +
        '<li>Run the tough ones again in a different tone: casual, polished, short, or kind.</li>' +
        '<li>For chat and email moments, rewrite the line as the actual Teams message or email.</li>' +
        '<li>Only say what’s true. Adapt every line to the real situation.</li>' +
      '</ol></details>' +
      '<footer class="foot">' +
        '<label for="name-input">Your name in the phrases</label>' +
        '<input id="name-input" value="' + esc(myName) + '" maxlength="30" autocomplete="given-name">' +
        '<span>Fill-in parts look like <span class="fill">this</span>. Cards marked New were added to the original list.</span>' +
      '</footer>' +
    '</main>';
  }

  // Study
  function startSession(title, ids, key) {
    if (!ids.length) return;
    S = { title: title, key: key, ids: ids, i: 0, got: [], again: [], flipped: false };
    go('study');
  }
  function cardHTML(c) {
    var d = deck(c.d);
    var badges = (c.new ? '<span class="badge">New</span>' : '') + (c.mine ? '<span class="badge">Yours</span>' : '');
    var cls = (d.lvl === 'adv' ? ' deep' : '') + (c.alt || c.f || c.why ? ' rich' : '');
    return '<div class="card enter' + cls + (S.flipped ? ' flipped' : '') + '" id="card" tabindex="0" role="button" aria-label="Flashcard. Press space to flip." style="--h:' + d.hue + '">' +
      '<div class="card-inner">' +
        '<div class="face front" aria-hidden="' + S.flipped + '">' +
          '<div class="face-head"><span class="tag">' + esc(d.name) + (c.t && c.t !== d.name && c.t !== 'Yours' ? ' · ' + esc(c.t) : '') + '</span>' + badges + '</div>' +
          '<p class="eyebrow">The moment</p>' +
          '<p class="scenario' + (c.s.length > 105 ? ' long' : '') + '">' + rich(c.s) + '</p>' +
          '<p class="hint">Say your answer out loud, then flip</p>' +
        '</div>' +
        '<div class="face back" aria-hidden="' + !S.flipped + '">' +
          '<p class="context">' + rich(c.s) + '</p>' +
          '<p class="eyebrow">' + (c.r ? 'Try saying' : 'Try this') + '</p>' +
          answerHTML(c) +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function studyView() {
    var c = BYID.get(S.ids[S.i]);
    return '<main class="wrap"><section class="study">' +
      '<div class="study-bar">' +
        '<button class="icon-btn" data-act="exit" aria-label="Back to decks">' + ICON.back + '</button>' +
        '<div class="study-title"><b>' + esc(S.title) + '</b><span>Card ' + (S.i + 1) + ' of ' + S.ids.length + '</span></div>' +
        '<button class="icon-btn" data-act="reshuffle" aria-label="Shuffle the rest">' + ICON.shuffle + '</button>' +
      '</div>' +
      '<div class="meter" aria-hidden="true"><span style="width:' + pct(S.i, S.ids.length) + '%"></span></div>' +
      '<div class="stage">' + cardHTML(c) + '</div>' +
      '<div class="grade">' +
        '<button class="btn learn" data-act="again"><kbd>←</kbd>Still learning</button>' +
        '<button class="btn" data-act="flip">Flip</button>' +
        '<button class="btn good" data-act="got">Got it<kbd>→</kbd></button>' +
      '</div>' +
      '<p class="keys desk">Space flips · ← still learning · → got it · Esc for decks</p>' +
      '<p class="keys touch">Tap the card to flip. Swipe right if you had it, left to see it again.</p>' +
    '</section></main>';
  }
  function flip() {
    if (!S) return;
    S.flipped = !S.flipped;
    var card = $('#card');
    if (!card) return;
    card.classList.remove('enter');
    card.classList.toggle('flipped', S.flipped);
    card.querySelector('.front').setAttribute('aria-hidden', String(S.flipped));
    card.querySelector('.back').setAttribute('aria-hidden', String(!S.flipped));
  }
  var busy = false;
  function grade(good) {
    if (busy || !S || ui.view !== 'study') return;
    busy = true;
    var id = S.ids[S.i];
    var p = prog[id] || { b: 0 };
    p.b = good ? Math.max(2, Math.min(3, p.b + 1)) : 1;
    p.t = Date.now();
    prog[id] = p;
    store.set(K.prog, prog);
    (good ? S.got : S.again).push(id);
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var card = $('#card');
    if (card && !reduce) { card.classList.remove('enter'); card.classList.add(good ? 'out-right' : 'out-left'); }
    setTimeout(function () {
      busy = false;
      S.i++;
      S.flipped = false;
      if (S.i >= S.ids.length) go('done'); else render();
    }, reduce ? 0 : 230);
  }
  function bindCard() {
    var card = $('#card');
    if (!card) return;
    var x0 = null, y0 = 0, dx = 0, drag = false, pid = null;
    function reset() { card.classList.remove('dragging'); card.style.transform = ''; card.dataset.lean = ''; }
    card.addEventListener('pointerdown', function (e) {
      if (e.button > 0) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; drag = false; pid = e.pointerId;
    });
    card.addEventListener('pointermove', function (e) {
      if (x0 === null || e.pointerId !== pid) return;
      dx = e.clientX - x0;
      var dy = e.clientY - y0;
      if (!drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) {
        drag = true;
        try { card.setPointerCapture(pid); } catch (err) {}
        card.classList.remove('enter');
        card.classList.add('dragging');
      }
      if (drag) {
        card.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 18) + 'deg)';
        card.dataset.lean = dx > 50 ? 'good' : dx < -50 ? 'learn' : '';
      }
    });
    card.addEventListener('pointerup', function (e) {
      if (x0 === null || e.pointerId !== pid) return;
      x0 = null;
      if (drag) {
        card.classList.remove('dragging');
        if (Math.abs(dx) > 90) grade(dx > 0); else reset();
      } else {
        flip();
      }
    });
    card.addEventListener('pointercancel', function () { x0 = null; if (drag) reset(); });
  }

  function rowHTML(c, q, withDelete) {
    var del = '';
    if (withDelete && c.mine) {
      del = ui.confirmDel === c.id
        ? '<div class="row-del">Delete this card? <button class="link danger" data-act="del-yes" data-id="' + c.id + '">Delete</button><button class="link" data-act="del-no">Keep it</button></div>'
        : '<div class="row-del"><button class="link" data-act="del" data-id="' + c.id + '">Delete</button></div>';
    }
    return '<article class="row" style="--h:' + deck(c.d).hue + '">' +
      '<div class="row-main">' +
        '<p class="row-s">' + rich(c.s, q) + (c.new ? ' <span class="badge sm">New</span>' : '') + (c.mine ? ' <span class="badge sm">Yours</span>' : '') + '</p>' +
        (c.r ? '<p class="row-r">' + rich(c.r, q) + '</p>' : '') +
        (c.tip ? '<p class="row-tip">' + rich(c.tip, q) + '</p>' : '') +
        (c.alt ? '<p class="row-x"><b>Or:</b> ' + rich(c.alt, q) + '</p>' : '') +
        (c.f ? '<p class="row-x"><b>If ' + rich(c.f.if, q) + ':</b> ' + rich(c.f.say, q) + '</p>' : '') +
        (c.why ? '<p class="row-tip">' + rich(c.why, q) + '</p>' : '') +
        del +
      '</div>' +
      (c.r ? '<button class="copy" data-act="copy" data-id="' + c.id + '">Copy</button>' : '') +
    '</article>';
  }
  function doneView() {
    var missed = S.again.map(function (id) { return BYID.get(id); }).filter(Boolean);
    return '<main class="wrap"><section class="done">' +
      '<p class="eyebrow">Round done · ' + esc(S.title) + '</p>' +
      '<h2>' + S.got.length + ' got it, ' + S.again.length + ' still learning</h2>' +
      '<div class="done-actions">' +
        (missed.length ? '<button class="btn primary" data-act="review-missed">Go over the ' + missed.length + ' I missed</button>' : '') +
        '<button class="btn' + (missed.length ? '' : ' primary') + '" data-act="replay">Run this set again</button>' +
        '<button class="btn ghost" data-act="exit">Back to decks</button>' +
      '</div>' +
      (missed.length ? '<div class="rows">' + missed.map(function (c) { return rowHTML(c, '', false); }).join('') + '</div>' : '<p class="muted">Every card landed. Nice.</p>') +
    '</section></main>';
  }

  // Phrasebook
  function bookView() {
    var tiers = advIds().length ? [{ id: 'adv', name: 'Advanced', hue: 225 }, { id: 'core', name: 'Essentials', hue: 225 }] : [];
    var chips = [{ id: 'all', name: 'All', hue: 225 }].concat(tiers, deckList()).map(function (d) {
      return '<button class="chip" data-act="filter" data-deck="' + d.id + '" aria-pressed="' + (ui.filter === d.id) + '" style="--h:' + d.hue + '">' + esc(d.name) + '</button>';
    }).join('');
    return '<main class="wrap book">' +
      '<div class="search">' + ICON.search + '<input id="book-q" type="search" placeholder="Search, like “disagree” or “weekend”" value="' + esc(ui.q) + '" autocomplete="off" aria-label="Search moments and phrases"></div>' +
      '<div class="chips" role="toolbar" aria-label="Filter by deck">' + chips + '</div>' +
      '<p class="count muted" id="book-count"></p>' +
      '<div id="book-rows"></div>' +
    '</main>';
  }
  function renderRows() {
    var rowsEl = $('#book-rows');
    if (!rowsEl) return;
    var q = ui.q.trim();
    var ql = q.toLowerCase();
    var list = CARDS.filter(function (c) { return inFilter(c, ui.filter); });
    if (ql) list = list.filter(function (c) {
      var hay = [c.s, c.r, c.tip, c.t, c.alt, c.f && c.f.if, c.f && c.f.say, c.why].filter(Boolean).join(' ');
      return nameSwap(hay).toLowerCase().indexOf(ql) !== -1;
    });
    $('#book-count').textContent = (ql || ui.filter !== 'all') ? list.length + ' of ' + CARDS.length + ' cards' : CARDS.length + ' cards';
    if (!list.length) {
      rowsEl.innerHTML = '<p class="empty">' + (q ? 'Nothing matches “' + esc(q) + '”. Try one word, or add it as a card.' : 'No cards here yet.') + '</p>';
      return;
    }
    rowsEl.innerHTML = deckList().map(function (d) {
      var items = list.filter(function (c) { return c.d === d.id; });
      if (!items.length) return '';
      return '<section class="group" style="--h:' + d.hue + '"><h3><i aria-hidden="true"></i>' + esc(d.name) + '<span class="muted">' + items.length + '</span></h3>' +
        '<div class="rows">' + items.map(function (c) { return rowHTML(c, q, true); }).join('') + '</div></section>';
    }).join('');
  }

  // Copy
  function copyText(btn, c) {
    var text = nameSwap(c.r || '');
    function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1400); }
    function fallback() {
      var row = btn.closest('.row');
      var p = row && row.querySelector('.row-r');
      if (p) { var range = document.createRange(); range.selectNodeContents(p); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range); }
      toast('Selected. Copy it from your keyboard.');
    }
    try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  // Adding cards. Saved on this device first; when the viewer can write this page,
  // the page republishes itself with the card embedded so every viewer gets it.
  var artifactP = null;
  var readOnly = false;
  function artifactNs() {
    if (!artifactP) {
      artifactP = (window.claude && typeof window.claude.use === 'function')
        ? Promise.resolve(window.claude.use('artifact')).catch(function () { return null; })
        : Promise.resolve(null);
    }
    return artifactP;
  }
  function jsonForScript(v) { return JSON.stringify(v).replace(/</g, '\\u003c'); }
  function buildPage(reset, mine) {
    var close = '</' + 'script>';
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      HEAD_MARKUP + '\n<style id="app-style">' + $('#app-style').textContent + '</style>\n' + SHELL + '\n' +
      '<script type="application/json" id="deck-data">' + $('#deck-data').textContent + close + '\n' +
      '<script type="application/json" id="my-cards">' + jsonForScript(mine) + close + '\n' +
      '<script id="app-script">' + $('#app-script').textContent + close + '\n</body></html>';
  }
  function shareMine(list) {
    if (readOnly) return Promise.resolve('local');
    return artifactNs().then(function (ns) {
      if (!ns || typeof ns.publish !== 'function') { readOnly = true; return 'local'; }
      var resetEl = Array.prototype.find.call(document.head.querySelectorAll('style'), function (s) {
        return /safe-area-inset/.test(s.textContent) && /\[hidden\]/.test(s.textContent);
      });
      if (!resetEl) { readOnly = true; return 'local'; }
      return ns.publish(buildPage(resetEl.textContent, list)).then(function () { return 'ok'; }, function (err) {
        var code = err && err.code;
        if (code === 'conflict') return 'conflict';
        if (!code || code === 'rate_limited' || code === 'upstream_error') return 'later';
        readOnly = true;
        return 'local';
      });
    });
  }
  function rawMine() {
    return EMBED.concat(localMine).map(function (c) { return { id: c.id, d: c.d, t: c.t, s: c.s, r: c.r }; });
  }

  function openAdd() {
    var preset = ui.view === 'book' && !/^(all|adv|core)$/.test(ui.filter) ? ui.filter : 'mine';
    var opts = [MINE].concat(DATA.decks).map(function (d) {
      return '<option value="' + d.id + '"' + (d.id === preset ? ' selected' : '') + '>' + esc(d.name) + '</option>';
    }).join('');
    $('#sheet-root').innerHTML = '<div class="sheet-backdrop" data-act="close-sheet"></div>' +
      '<form class="sheet" id="add-form" role="dialog" aria-modal="true" aria-labelledby="add-title" novalidate>' +
        '<h2 id="add-title">Add a card</h2>' +
        '<label for="add-s">The moment</label>' +
        '<textarea id="add-s" rows="2" maxlength="220" placeholder="Someone in the elevator asks what you’re working on"></textarea>' +
        '<label for="add-r">What to say</label>' +
        '<textarea id="add-r" rows="3" maxlength="420" placeholder="Mostly [project] right now. It’s been a fun one. What about you?"></textarea>' +
        '<label for="add-d">Deck</label>' +
        '<select id="add-d">' + opts + '</select>' +
        '<p class="sheet-note">Put fill-in parts in [brackets]. The card is saved on this device right away' + (window.claude ? '. If you own this page and you’re signed in, it’s added to the page for everyone too.' : ' and stays in this browser.') + '</p>' +
        '<p class="sheet-error" id="add-error" hidden></p>' +
        '<div class="sheet-actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancel</button><button type="submit" class="btn primary">Add card</button></div>' +
      '</form>';
    setTimeout(function () { var f = $('#add-s'); if (f) f.focus(); }, 40);
  }
  function closeSheet() { $('#sheet-root').innerHTML = ''; }
  function sheetOpen() { return !!$('#add-form'); }
  function saveNew() {
    var s = $('#add-s').value.trim(), r = $('#add-r').value.trim(), d = $('#add-d').value;
    if (!s || !r) {
      var err = $('#add-error');
      err.textContent = !s ? 'Describe the moment first.' : 'Add what you’d say.';
      err.hidden = false;
      (!s ? $('#add-s') : $('#add-r')).focus();
      return;
    }
    var card = { id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), d: deck(d).id, t: 'Yours', s: s.slice(0, 220), r: r.slice(0, 420) };
    localMine.push(card);
    store.set(K.mine, localMine);
    rebuild();
    closeSheet();
    render();
    toast('Card added');
    shareMine(rawMine()).then(function (res) {
      if (res === 'ok') toast('Added for everyone. Updating the page…');
      else if (res === 'later') toast('Card added on this device. Sharing it didn’t work this time.');
    });
  }
  function deleteCard(id) {
    var wasLocal = localMine.some(function (c) { return c.id === id; });
    if (wasLocal) { localMine = localMine.filter(function (c) { return c.id !== id; }); store.set(K.mine, localMine); }
    if (embIds.has(id)) {
      var next = rawMine().filter(function (c) { return c.id !== id; });
      shareMine(next).then(function (res) {
        if (res === 'ok') toast('Removed. Updating the page…');
        else toast(res === 'later' ? 'Couldn’t remove it right now. Try again in a minute.' : 'Only the page’s owner can remove shared cards.');
      });
      return;
    }
    delete prog[id];
    store.set(K.prog, prog);
    rebuild();
    if (ui.filter === 'mine' && !CARDS.some(function (c) { return c.d === 'mine'; })) ui.filter = 'all';
    render();
    toast('Card deleted');
  }

  // Events
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.dataset.act;
    if (act === 'home') { ui.reveal = false; go('home'); }
    else if (act === 'book') go('book');
    else if (act === 'add') openAdd();
    else if (act === 'close-sheet') closeSheet();
    else if (act === 'reveal') { ui.reveal = true; render(); }
    else if (act === 'deck') { var dd = deck(el.dataset.deck); startSession(dd.name, ordered(idsIn(dd.id)), 'deck'); }
    else if (act === 'quick') startSession('Quick 10', shuffle(ordered(allIds()).slice(0, 10)), 'quick');
    else if (act === 'quick-adv') startSession('Quick 10: advanced', shuffle(ordered(advIds()).slice(0, 10)), 'quick-adv');
    else if (act === 'learning') startSession('Still learning', shuffle(allIds().filter(function (id) { return box(id) === 1; })), 'learning');
    else if (act === 'shuffle-all') startSession('Everything, shuffled', shuffle(allIds()), 'all');
    else if (act === 'exit') { S = null; go('home'); }
    else if (act === 'flip') flip();
    else if (act === 'got') grade(true);
    else if (act === 'again') grade(false);
    else if (act === 'reshuffle' && S) {
      S.ids = S.ids.slice(0, S.i).concat(shuffle(S.ids.slice(S.i)));
      S.flipped = false;
      render();
      toast('Shuffled the rest of this round');
    }
    else if (act === 'review-missed' && S) startSession(S.title.replace(/: missed$/, '') + ': missed', shuffle(S.again), S.key);
    else if (act === 'replay' && S) startSession(S.title, ordered(S.ids), S.key);
    else if (act === 'filter') {
      ui.filter = el.dataset.deck;
      Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (ch) { ch.setAttribute('aria-pressed', String(ch.dataset.deck === ui.filter)); });
      renderRows();
    }
    else if (act === 'copy') { var cc = BYID.get(el.dataset.id); if (cc) copyText(el, cc); }
    else if (act === 'del') { ui.confirmDel = el.dataset.id; renderRows(); }
    else if (act === 'del-no') { ui.confirmDel = null; renderRows(); }
    else if (act === 'del-yes') { ui.confirmDel = null; deleteCard(el.dataset.id); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'book-q') { ui.q = e.target.value; renderRows(); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'name-input') {
      myName = e.target.value.trim().slice(0, 30) || 'Alex';
      store.set(K.name, myName);
      render();
      toast('Phrases now use ' + myName);
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'add-form') return;
    e.preventDefault();
    saveNew();
  });
  document.addEventListener('keydown', function (e) {
    if (sheetOpen()) { if (e.key === 'Escape') closeSheet(); return; }
    var tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (ui.view === 'study') {
      if (e.key === ' ' || e.key === 'Enter') {
        if (tag === 'BUTTON') return;
        e.preventDefault();
        flip();
      } else if (e.key === 'ArrowRight') { e.preventDefault(); grade(true); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); grade(false); }
      else if (e.key === 'Escape') { S = null; go('home'); }
    } else if (ui.view === 'done' && e.key === 'Escape') { S = null; go('home'); }
  });

  if (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__wsf = { buildPage: buildPage };

  ui.view = location.hash === '#phrasebook' ? 'book' : 'home';
  render();
})();
</script>
</body></html>
