<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Flashcards for high-stakes workplace conversations: what to say, another way to say it, what to do if they push back, and why it works."><meta name="theme-color" content="#3244C9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fluency"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='8' y='14' width='40' height='32' rx='6' fill='%23E2E6FA' stroke='%23152033' stroke-width='4' transform='rotate(-9 28 30)'/%3E%3Crect x='16' y='18' width='40' height='32' rx='6' fill='%23fff' stroke='%23152033' stroke-width='4' transform='rotate(5 36 34)'/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Workplace Social Fluency</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap">
<style id="app-style">
/* Layout: an index-card box. Decks are divider cards with tabs; studying shows one big card at a time. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --ink: #152033;
  --muted: #586478;
  --line: #D6DCE5;
  --accent: #3244C9;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E6FA;
  --good: #16815A;
  --good-soft: #DAF1E5;
  --learn: #A9640A;
  --learn-soft: #FAE8CC;
  --mark: #FFE27A;
  --scrim: rgb(12 18 30 / .45);
  --tile-s: 70%;
  --tile-l: 91%;
  --tile-ink: 24%;
  --tab-l: 56%;
  --bubble-l: 95%;
  --deep-s: 44%;
  --deep-l: 27%;
  --deep-ink: 97%;
  --shadow: 0 1px 2px rgb(21 32 51 / .06), 0 10px 28px rgb(21 32 51 / .09);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1219; --surface: #161D27; --ink: #E6EBF2; --muted: #98A3B4; --line: #263142;
    --accent: #98A5FF; --accent-ink: #0D1219; --accent-soft: #222A49;
    --good: #4CC68D; --good-soft: #143326; --learn: #ECA851; --learn-soft: #3A2A13;
    --mark: #7A6315; --scrim: rgb(0 0 0 / .6);
    --tile-s: 28%; --tile-l: 19%; --tile-ink: 87%; --tab-l: 52%; --bubble-l: 24%;
    --deep-s: 36%; --deep-l: 31%; --deep-ink: 96%;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 30px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1219; --surface: #161D27; --ink: #E6EBF2; --muted: #98A3B4; --line: #263142;
  --accent: #98A5FF; --accent-ink: #0D1219; --accent-soft: #222A49;
  --good: #4CC68D; --good-soft: #143326; --learn: #ECA851; --learn-soft: #3A2A13;
  --mark: #7A6315; --scrim: rgb(0 0 0 / .6);
  --tile-s: 28%; --tile-l: 19%; --tile-ink: 87%; --tab-l: 52%; --bubble-l: 24%;
    --deep-s: 36%; --deep-l: 31%; --deep-ink: 96%;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 12px 30px rgb(0 0 0 / .35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { margin: 0; font-size: .74rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 18px; padding-block: 12px; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
.mark { position: relative; flex: none; width: 30px; height: 24px; }
.mark i { position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 5px; background: var(--surface); }
.mark i:first-child { transform: rotate(-9deg) translate(-2px, 1px); background: var(--accent-soft); }
.mark i:last-child { transform: rotate(5deg) translate(3px, -1px); }
.brand-name { font-family: var(--f-display); font-size: 1.12rem; font-weight: 760; letter-spacing: -.01em; line-height: 1.15; }
.brand-sub { display: block; font-family: var(--f-body); font-size: .78rem; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.tabs { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.tab { padding: 7px 15px; border: 0; border-radius: 999px; background: none; font-size: .92rem; font-weight: 700; color: var(--muted); }
.tab[aria-current="page"] { background: var(--ink); color: var(--bg); }
.add-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-size: .92rem; font-weight: 700; }
@media (max-width: 560px) {
  .top .wrap { gap: 10px 12px; padding-block: 10px; }
  .tabs { order: 3; flex: 1 1 100%; }
  .tab { flex: 1; }
  .add-btn { width: 42px; height: 42px; justify-content: center; padding: 0; }
  .add-btn span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
}
body.studying .top { display: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: .95rem; font-weight: 700; text-align: center; }
.btn.primary { border-color: transparent; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.learn { border-color: transparent; background: var(--learn-soft); color: var(--learn); }
.btn.good { border-color: transparent; background: var(--good-soft); color: var(--good); }
.link { padding: 0; border: 0; background: none; font-size: .84rem; font-weight: 700; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--learn); }
kbd { padding: 0 6px; border: 1px solid currentColor; border-radius: 5px; font-family: var(--f-body); font-size: .74rem; opacity: .7; }

/* Home */
.home { display: grid; gap: 30px; padding-block: 24px 48px; }
.today { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .today { grid-template-columns: 1fr; } }
.moment, .panel { display: grid; align-content: start; gap: 12px; padding: 22px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.moment { box-shadow: var(--shadow); }
.moment .eyebrow { color: hsl(var(--h) 50% var(--tile-ink)); }
.moment .scenario { margin: 0; font-family: var(--f-display); font-size: clamp(1.35rem, 3.4vw, 1.75rem); font-weight: 650; line-height: 1.2; letter-spacing: -.012em; text-wrap: balance; }
.moment .btn { justify-self: start; }
.tally { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.tally b { font-family: var(--f-display); font-size: 2.5rem; font-weight: 760; line-height: 1; }
.stack { display: flex; height: 10px; overflow: hidden; border-radius: 999px; background: var(--line); }
.stack .k { background: var(--good); }
.stack .l { background: var(--learn); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 6px; border-radius: 50%; vertical-align: 0; }
.actions { display: grid; gap: 8px; }

.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.section-head h2 { margin: 0; font-family: var(--f-display); font-size: 1.4rem; font-weight: 760; letter-spacing: -.01em; }
.section-head span { font-size: .88rem; }
.decks { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 32px 16px; padding-top: 20px; }
@media (max-width: 480px) { .decks { grid-template-columns: 1fr 1fr; gap: 28px 12px; } }
.deck { position: relative; display: grid; align-content: space-between; gap: 12px; min-height: 128px; padding: 16px 16px 14px; border: 0; border-radius: 0 var(--r) var(--r) var(--r); background: hsl(var(--h) var(--tile-s) var(--tile-l)); color: hsl(var(--h) 45% var(--tile-ink)); text-align: left; transition: transform .15s ease, box-shadow .15s ease; }
.deck:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.deck-tab { position: absolute; left: 0; top: -16px; height: 17px; padding: 0 12px; border-radius: 9px 9px 0 0; background: inherit; font-size: .72rem; font-weight: 700; line-height: 18px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.deck-name { font-family: var(--f-display); font-size: 1.07rem; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.deck-meter { display: flex; height: 6px; overflow: hidden; border-radius: 999px; background: hsl(var(--h) 30% var(--tile-ink) / .14); }
.deck-meter .k { background: hsl(var(--h) 55% var(--tile-ink)); }
.deck-meter .l { background: hsl(var(--h) 55% var(--tile-ink) / .4); }
.deck-foot { font-size: .8rem; opacity: .88; font-variant-numeric: tabular-nums; }
.deck.deep { background: hsl(var(--h) var(--deep-s) var(--deep-l)); color: hsl(var(--h) 30% var(--deep-ink)); }
.deck.deep .deck-meter { background: hsl(0 0% 100% / .16); }
.deck.deep .deck-meter .k { background: hsl(var(--h) 30% var(--deep-ink)); }
.deck.deep .deck-meter .l { background: hsl(var(--h) 30% var(--deep-ink) / .45); }
.tier { display: grid; gap: 4px; }
.tier-note { margin: 0; max-width: 62ch; font-size: .92rem; color: var(--muted); }
.tiers { display: grid; gap: 4px; font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.tiers div { display: flex; justify-content: space-between; gap: 12px; }

.howto { padding: 14px 18px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.howto summary { font-weight: 700; cursor: pointer; }
.howto ol { display: grid; gap: 6px; max-width: 65ch; margin: 12px 0 4px; padding-left: 1.3em; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .88rem; color: var(--muted); }
.foot label { font-weight: 700; color: var(--ink); }
.foot input { width: 9em; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }

/* Phrase text */
.say { margin: 0; padding: 16px 20px; border-radius: 18px 18px 18px 5px; background: hsl(var(--h) var(--tile-s) var(--bubble-l)); color: var(--ink); font-size: clamp(1.2rem, 3.6vw, 1.5rem); font-weight: 700; line-height: 1.38; }
.say.mid { font-size: clamp(1.1rem, 3.2vw, 1.32rem); }
.say.long { font-size: clamp(1rem, 2.9vw, 1.18rem); }
.tip { display: flex; gap: 10px; align-items: baseline; margin: 0; font-size: .95rem; color: var(--muted); }
.tip b { flex: none; padding: 1px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
.tip.solo { font-size: 1.15rem; font-weight: 700; color: var(--ink); }
.fill { display: inline-block; padding: 0 .32em; border: 1.5px dashed currentColor; border-radius: 6px; font-weight: 400; line-height: 1.25; opacity: .78; }
mark { padding: 0 1px; border-radius: 3px; background: var(--mark); color: inherit; }
.badge { padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--bg); font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.badge.sm { padding: 1px 6px; font-size: .62rem; vertical-align: 1px; }

/* Study */
.study { display: grid; gap: 14px; max-width: 620px; margin: 0 auto; padding-block: 14px 24px; }
.study-bar { display: flex; align-items: center; gap: 10px; }
.icon-btn { display: grid; flex: none; place-items: center; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.study-title { display: flex; flex: 1; flex-direction: column; min-width: 0; }
.study-title b { overflow: hidden; font-family: var(--f-display); font-size: 1.08rem; white-space: nowrap; text-overflow: ellipsis; }
.study-title span { font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.meter { height: 6px; overflow: hidden; border-radius: 999px; background: var(--line); }
.meter span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }
.stage { perspective: 1400px; }
.card { position: relative; width: 100%; height: clamp(360px, 58vh, 500px); border-radius: 22px; cursor: pointer; touch-action: pan-y; user-select: none; -webkit-user-select: none; transition: transform .23s ease, opacity .23s ease; }
.card:focus-visible { outline-offset: 6px; }
.card.dragging { transition: none; }
.card.enter { animation: enter .28s ease both; }
@keyframes enter { from { opacity: 0; transform: translateY(14px) scale(.985); } }
.card.out-right { transform: translateX(115%) rotate(10deg) !important; opacity: 0; }
.card.out-left { transform: translateX(-115%) rotate(-10deg) !important; opacity: 0; }
.card-inner { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.2, .75, .2, 1); }
.card.flipped .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px; overflow: auto; padding: 24px; border-radius: 22px; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: var(--shadow); }
.front { background: hsl(var(--h) var(--tile-s) var(--tile-l)); color: hsl(var(--h) 45% var(--tile-ink)); }
.front .eyebrow { color: inherit; opacity: .72; margin-top: auto; }
.back { border: 1px solid var(--line); background: var(--surface); transform: rotateY(180deg); }
.back .eyebrow { margin-top: auto; }
.back .say { margin-bottom: auto; }
.face-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tag { padding: 4px 10px; border-radius: 999px; background: hsl(var(--h) 45% var(--tile-ink) / .1); font-size: .78rem; font-weight: 700; }
.front .scenario.long { font-size: clamp(1.3rem, 4vw, 1.7rem); }
.front .scenario { margin: 0 0 auto; font-family: var(--f-display); font-size: clamp(1.6rem, 5vw, 2.15rem); font-weight: 650; line-height: 1.14; letter-spacing: -.015em; text-wrap: balance; }
.hint { margin: 0; font-size: .85rem; opacity: .75; }
.context { margin: 0; font-size: .9rem; color: var(--muted); }
.card.deep .front { background: hsl(var(--h) var(--deep-s) var(--deep-l)); color: hsl(var(--h) 30% var(--deep-ink)); }
.card.deep .tag { background: hsl(0 0% 100% / .14); }
.card.deep .badge { background: hsl(0 0% 100% / .9); color: hsl(var(--h) 45% 18%); }
.card.rich { height: clamp(460px, 74vh, 680px); }
.card.rich .back { gap: 12px; }
.card.rich .back .eyebrow { margin-top: 0; }
.card.rich .back .say { margin-bottom: 0; font-size: clamp(1.08rem, 3.2vw, 1.3rem); }
.card.rich .back .say.long { font-size: clamp(1rem, 2.9vw, 1.15rem); }
.alt { margin: 0; padding: 11px 15px; border: 1.5px solid hsl(var(--h) 45% var(--tab-l) / .6); border-radius: 16px 16px 16px 5px; font-size: .98rem; font-weight: 700; line-height: 1.4; }
.ex-k { display: block; margin-bottom: 5px; font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.follow { margin: 0; font-size: .98rem; line-height: 1.42; }
.follow .ex-if { display: block; margin-bottom: 3px; font-size: .86rem; font-style: italic; color: var(--muted); }
.why { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: .92rem; line-height: 1.45; color: var(--muted); }
.why b { margin-right: 6px; color: var(--ink); }
.moment .alt, .moment .follow, .moment .why { max-width: 62ch; }
.card[data-lean="good"] .face { box-shadow: 0 0 0 3px var(--good), var(--shadow); }
.card[data-lean="learn"] .face { box-shadow: 0 0 0 3px var(--learn), var(--shadow); }
.grade { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; }
.keys { margin: 0; font-size: .8rem; text-align: center; color: var(--muted); }
.keys.touch { display: none; }
@media (hover: none) {
  .keys.desk, .grade kbd { display: none; }
  .keys.touch { display: block; }
}

/* Done */
.done { display: grid; gap: 18px; max-width: 680px; margin: 0 auto; padding-block: 36px 48px; }
.done h2 { margin: 0; font-family: var(--f-display); font-size: clamp(1.7rem, 5vw, 2.3rem); font-weight: 760; letter-spacing: -.015em; line-height: 1.12; text-wrap: balance; }
.done-actions { display: flex; flex-wrap: wrap; gap: 8px; }

/* Phrasebook */
.book { display: grid; gap: 14px; padding-block: 20px 48px; }
.search { position: relative; }
.search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 14px 16px 14px 46px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-size: 1.05rem; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.chip { flex: none; padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: .85rem; font-weight: 700; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: transparent; background: hsl(var(--h) var(--tile-s) var(--tile-l)); color: hsl(var(--h) 45% var(--tile-ink)); }
.count { margin: 0; font-size: .86rem; font-variant-numeric: tabular-nums; }
.group h3 { display: flex; align-items: center; gap: 9px; margin: 14px 0 8px; font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; }
.group h3 i { width: 11px; height: 11px; border-radius: 3px; background: hsl(var(--h) 60% var(--tab-l)); }
.group h3 span { font-family: var(--f-body); font-size: .82rem; font-weight: 400; }
.rows { display: grid; gap: 8px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.row-main { min-width: 0; }
.row-s { margin: 0 0 3px; font-size: .86rem; color: var(--muted); }
.row-r { margin: 0; font-size: 1.02rem; font-weight: 700; }
.row-tip { margin: 4px 0 0; font-size: .86rem; font-style: italic; color: var(--muted); }
.row-x { margin: 6px 0 0; font-size: .9rem; }
.row-x b { font-weight: 700; color: var(--muted); }
.row-del { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: .84rem; color: var(--muted); }
.copy { padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: transparent; font-size: .8rem; font-weight: 700; color: var(--muted); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); }

/* Add sheet */
.sheet-backdrop { position: fixed; inset: 0; z-index: 40; background: var(--scrim); }
.sheet { position: fixed; left: 50%; bottom: 0; z-index: 41; display: grid; gap: 8px; width: min(560px, 100%); max-height: 92%; overflow: auto; padding: 22px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); border-radius: 20px 20px 0 0; background: var(--surface); box-shadow: 0 -10px 40px rgb(0 0 0 / .2); transform: translateX(-50%); }
@media (min-width: 700px) { .sheet { top: 50%; bottom: auto; border-radius: 20px; transform: translate(-50%, -50%); } }
.sheet h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 1.35rem; font-weight: 760; }
.sheet label { margin-top: 4px; font-size: .88rem; font-weight: 700; }
.sheet textarea, .sheet select { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 1rem; resize: vertical; }
.sheet-note { margin: 4px 0 0; font-size: .84rem; color: var(--muted); }
.sheet-error { margin: 0; font-size: .88rem; font-weight: 700; color: var(--learn); }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: .9rem; font-weight: 700; opacity: 0; pointer-events: none; transform: translate(-50%, 16px); transition: opacity .2s ease, transform .2s ease; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .card-inner, .card.flipped .card-inner { transform: none; }
  .face { backface-visibility: visible; -webkit-backface-visibility: visible; }
  .back { transform: none; opacity: 0; }

  .card.flipped .front { opacity: 0; }
}

<script type="application/json" id="deck-data">{"decks":[{"id":"exec","name":"Executive presence","hue":210,"lvl":"adv"},{"id":"room","name":"Running the room","hue":185,"lvl":"adv"},{"id":"influence","name":"Influence without authority","hue":155,"lvl":"adv"},{"id":"pushback","name":"Pushback & hard conversations","hue":5,"lvl":"adv"},{"id":"negotiate","name":"Negotiating trade-offs","hue":35,"lvl":"adv"},{"id":"recovery","name":"Bad news & recovery","hue":340,"lvl":"adv"},{"id":"manageup","name":"Managing up & career","hue":270,"lvl":"adv"},{"id":"network","name":"Networking with leaders","hue":305,"lvl":"adv"},{"id":"social","name":"High-stakes small talk","hue":125,"lvl":"adv"},{"id":"phrases","name":"Power phrases","hue":240,"lvl":"adv"},{"id":"intros","name":"Introductions","hue":202,"lvl":"core"},{"id":"arrivals","name":"Hallways & arrivals","hue":337,"lvl":"core"},{"id":"smalltalk","name":"Small talk","hue":45,"lvl":"core"},{"id":"coffee","name":"Coffee, lunch & life","hue":22,"lvl":"core"},{"id":"listening","name":"Listening & follow-ups","hue":157,"lvl":"core"},{"id":"personality","name":"Personality & humor","hue":315,"lvl":"core"},{"id":"groups","name":"Groups & networking","hue":180,"lvl":"core"},{"id":"meetings","name":"Meetings","hue":225,"lvl":"core"},{"id":"leaders","name":"Leaders & career","hue":247,"lvl":"core"},{"id":"presenting","name":"Presenting & video calls","hue":270,"lvl":"core"},{"id":"chat","name":"Teams chat","hue":135,"lvl":"core"},{"id":"email","name":"Email","hue":90,"lvl":"core"},{"id":"awkward","name":"Awkward moments","hue":0,"lvl":"core"},{"id":"feedback","name":"Feedback & boundaries","hue":67,"lvl":"core"},{"id":"support","name":"Celebrations & inclusion","hue":112,"lvl":"core"}],"cards":[{"d":"exec","t":"No answer yet","s":"Mid-review, a VP asks why [segment] retention dipped in March. You don’t know, and six people turn to look at you","r":"I don’t know yet, and I won’t guess on something this visible. My first place to look is [driver]. You’ll have a real answer from me by [time] today.","alt":"I can tell you what it isn’t: [factor A] and [factor B] held steady, so it’s not those. I’ll pin down what it is by [time]. Want it in the deck or just to you?","f":{"if":"they press: “Best guess, then?”","say":"Best guess is [driver], and I’d call it likely, not certain. I’ll confirm by [time] so nobody plans around a hunch."},"why":"Admit the gap once, share what you do know, and name a time. Calibrated uncertainty earns more trust than a confident guess.","id":"a001"},{"d":"exec","t":"Numbers challenged","s":"An SVP stops you mid-slide in front of twelve people: “That [metric] number can’t be right.” You’ve reconciled it twice and know it is","r":"Fair challenge, it’s a big move. It’s [number] on [definition], pulled from [source] and reconciled against [second source]. If you’re comparing it to [other report], that one counts [difference]. Glad to walk you through the bridge after.","alt":"Which number were you expecting? A gap that size is usually a definition difference, and I’d rather find it with you than debate it in front of everyone.","f":{"if":"they say “I still don’t buy it”","say":"That’s fair, and I don’t want the room deciding on a number you doubt. I’ll send the reconciliation line by line by [time]. If I’m wrong, I’ll say so."},"why":"Defend the method, not your ego. Show source and definition, then hunt for the mismatch; most number fights are really definition fights.","id":"a002"},{"d":"exec","t":"Serial interrupter","s":"Ten minutes into your readout for a client, their COO has cut in four times with questions your later slides answer. You’re still on slide 3","r":"Let me jump ahead, because you’re asking the right things. The answer is [conclusion], and here’s the slide that shows it. I’ll skip the setup unless you want it.","alt":"Can I suggest something? Give me ninety seconds for the whole story end to end, then let’s spend the rest of the time on whatever you want to pull apart.","f":{"if":"they keep interrupting after you jump ahead","say":"It sounds like the real question is [their concern], so let’s spend our time there. I’ll send the rest of the deck afterward with a two-line summary on top."},"why":"Interruptions are data about what the exec cares about. Follow their questions to your conclusion instead of defending your slide order.","id":"a003"},{"d":"exec","t":"Your call","s":"After you lay out three options for the vendor migration, the managing director leans back: “Forget the options. What would you do?”","r":"I’d do [option B]. It costs more up front, but it’s the only one that doesn’t put [critical thing] at risk in Q4. What would change my mind is [condition].","alt":"B, and I’d start Monday. If you want a hedge, keep A warm as a fallback for [period]. I wouldn’t spend a dollar on C.","f":{"if":"they say B is too expensive","say":"Then A, with eyes open: it saves [amount], but we carry [risk] until [date]. I’d want a named owner checking that risk every week."},"why":"When asked for your view, give one answer, the reason, and what would change your mind. Options without a pick read as hedging.","id":"a004"},{"d":"exec","t":"Skip-level","s":"You finally get thirty minutes with your boss’s boss, who opens with “So, what’s on your mind?” and then just waits","r":"Two things. First, a pattern I’m seeing with [clients or partners] that I think matters for [their priority]. Second, I’d like your read on where [area] is headed, so I’m pointing my work at the right thing.","alt":"What’s the one thing you wish people at my level understood better about [their priority]? I’d like to make sure my work is aimed at it.","f":{"if":"they ask what isn’t working on your team","say":"Honestly, [process issue] slows us down. [Manager] and I are already on it. The piece that sits above us is [cross-team dependency], and that’s where your help would count."},"why":"Bring an insight tied to their priorities and a question about their thinking. Status updates are forgettable; a sharp observation isn’t.","id":"a005"},{"d":"exec","t":"Sixty seconds","s":"The CEO steps into the elevator with you, nods, and asks what you’re working on. You have about four floors","r":"I’m on [project]. We’re taking [process] from [X days] to [Y], which matters for [company priority]. The surprise so far: [one sharp insight they won’t hear elsewhere].","alt":"[Project], which gets [outcome] for [team or client]. Can I ask you something while I have you? What would you most want our group to get right this year?","f":{"if":"they say “Interesting, tell me more” as the doors open","say":"Short version: [insight], and it probably applies to [other area] too. I’m [name] on [team]. Would a one-page note be useful?"},"why":"Prepare two sentences before you need them: project, outcome tied to their priority, one surprising insight. Specific beats polite.","id":"a006"},{"d":"exec","t":"Vague direction","s":"Your division head ends a meeting with “Make the client experience more premium,” then stands up to leave. You have no idea what that means in practice","r":"Before you go, so I aim at the right thing: if this works, what’s different in six months? Fewer complaints, a higher [score], or something clients would actually say out loud?","alt":"I’ll come back Thursday with two versions, one about speed of service and one about how it looks and feels, and you tell me which is closer. Fifteen minutes?","f":{"if":"they say “You’ll know it when you see it”","say":"Then let me show you something rough early rather than polished late. Can I grab ten minutes Thursday to put a first cut in front of you?"},"why":"Turn vague direction into a success measure or concrete options to react to. Execs answer “which one?” faster than “what do you mean?”","id":"a007"},{"d":"exec","t":"Wrong fact","s":"On an all-hands call, your EVP tells 200 people that [product] has [number] users. You own that dashboard, and the real figure is about a third of it","r":"Heads-up from the all-hands: the [product] user figure was [number], and the current count is [correct number] as of [date]. Flagging it before it gets quoted. Want me to add a correction to the recap?","alt":"One update to that: the latest count is [correct number], since [reason the figures differ]. Glad to share the detail after.","f":{"if":"they reply that it’s directional and not a big deal","say":"Agreed it’s directional. My worry is [team or client] quoting it in [forecast or deck]. A one-line fix in the recap closes that off, and I can draft it."},"why":"Correct seniors privately and fast, with the source and a fix ready. Let them correct themselves before anyone else does it for them.","id":"a008"},{"d":"exec","t":"Post-meeting note","s":"You just left a forty-minute session where the CFO approved your plan with two conditions. Nobody took notes, and three teams will remember it differently","r":"Subject: [Project] approved, two conditions. Thanks for the time today. Decision: go ahead with [plan]. Conditions: [condition 1] and [condition 2]. Next: [owner] delivers [item] by [date]. If I’ve got any of that wrong, reply and I’ll fix it.","alt":"Confirming today: [plan] is a go, conditional on [condition 1] and [condition 2]. I’ll report back on both by [date]. Shout if that’s not how you heard it.","f":{"if":"a peer replies all, disputing one of the conditions","say":"Thanks, Marcus. That’s not how I heard it, so let’s not guess. [CFO’s name], which did you intend? We’ll plan around your answer."},"why":"Write the decision down within the hour, in the decision maker’s words. Whoever writes the summary shapes what everyone remembers.","id":"a009"},{"d":"exec","t":"Decision by email","s":"You need the head of risk to choose between two approaches by Friday. She gets three hundred emails a day and skims most of them","r":"Subject: Decision by Fri: [A] or [B] for [project]. I recommend A because [one-line reason]. B is [cheaper] but [downside]. A one-word reply works. If I haven’t heard by Friday noon, I’ll proceed with A.","alt":"Hi [name], one decision from you unblocks [project]: [A] or [B]. The detail is in my email from Tuesday, and I recommend A. A one-word reply is plenty.","f":{"if":"she replies with a question instead of a decision","say":"[One-line answer]. That doesn’t change my recommendation, so still A. If you’re comfortable, a quick yes keeps us on track for [date]."},"why":"Put the ask and deadline in the subject line, recommend, and make the reply one word. A sensible default stops silence from stalling you.","id":"a010"},{"d":"exec","t":"New leader","s":"A new managing director has joined from outside and booked twenty minutes with you in her first week. Your team’s budget is on her review list","r":"Welcome aboard. Three things from me: what we do in one line, the two numbers I’d judge us on, and the one thing I’d fix first if I were you. Then I’d like to hear what you’re solving for.","alt":"I’ll keep the overview short, because you’ll get plenty of those this week. What would make this team indispensable to you a year from now?","f":{"if":"they ask why your team costs so much","say":"Fair question. Most of it is [cost driver], which supports [outcome they care about]. I can show you the split by [line] and where I think we could run leaner."},"why":"New leaders sort people into assets and costs fast. Know your numbers cold and offer an honest view before they have to ask.","id":"a011"},{"d":"exec","t":"Reorg opinion","s":"Over coffee, an SVP asks what you honestly think of the reorg that merged your team with [team]. Your manager publicly backed it; you have doubts","r":"The logic makes sense to me, especially [benefit]. Where I’d watch closely is [specific risk], because that’s where handoffs used to break. If we get ahead of that early, it works.","alt":"Honestly? Too early for me to call. The thing I’m watching is [leading indicator]. If that’s still slipping by [month], I’d want us to revisit [part].","f":{"if":"they push: “But would you have done it?”","say":"Probably, with one change: I’d have kept [function] separate until [milestone]. I’ve said the same to [manager], so it won’t be news to them."},"why":"Give a candid, specific view framed as a risk to manage, not a verdict. Never say upward what you haven’t said to your manager.","id":"a012"},{"d":"exec","t":"Five minutes’ notice","s":"Your director pings you: the presenter is out sick, and you’re up in five minutes to walk the ops committee through [project] status. No deck","r":"I’m covering for [name], so this’ll be short. Three things: where we are, the one risk you should know about, and the decision we’ll need from you in [month]. Stop me anywhere.","alt":"Headline first: [project] is [on track or behind] because of [reason]. I’ll keep it high level, and [name] will follow up with the full numbers on [day].","f":{"if":"a committee member asks a detailed question you can’t answer","say":"That’s one for [name], who owns the numbers. I’ll get you the answer by [time] tomorrow rather than give you a rough one now."},"why":"Under pressure, impose structure before content. A three-part frame makes thin preparation sound deliberate and buys you thinking time.","id":"a013"},{"d":"exec","t":"Town hall question","s":"At the quarterly town hall, the CEO opens the mic. You have a real question about how the new strategy affects [your area], and 800 people are listening","r":"I’m [name] in [team]. You said [priority] is the top goal this year. For teams like mine working on [area], what’s the one thing you’d want us to stop doing to make room for it?","alt":"[Name], [team]. What would have to be true by year end for you to call [strategy] a success, and how will the rest of us know we’re on track?","f":{"if":"the CEO gives a vague, general answer","say":"That helps. As the plan firms up, who should teams like mine bring [area] questions to?"},"why":"Ask about trade-offs or success criteria, framed in their words. A specific, forward question signals judgment; a complaint signals grievance.","id":"a014"},{"d":"exec","t":"Not convinced","s":"You finish your pitch for a new [tool or hire], and the EVP folds her arms: “I’m not convinced.” Then silence","r":"That’s useful to hear. Which part isn’t landing: the cost, the timing, or whether the problem is big enough to fix now?","alt":"Fair. What would you need to see to get comfortable? If it’s proof, I can run a [four-week] pilot on [small scope] and come back with the numbers.","f":{"if":"they say the problem isn’t big enough","say":"Then that’s mine to prove. Last quarter it cost us [measure]. I’ll come back with a sharper number, and if it’s still small, I’ll drop it."},"why":"Diagnose the objection before re-pitching. Repeating the case louder loses; finding the specific doubt, or shrinking the ask, wins.","id":"a015"},{"d":"exec","t":"Frustrated exec","s":"The head of operations, visibly annoyed, says your team has “dropped the ball again” on the [report] delay, in front of her whole team","r":"You’ve got every reason to be frustrated. It’s the second slip, and it’s on us. The cause was [cause]. The fix is [fix], live from [date], and I’ll confirm it in writing today.","alt":"I hear you, and I won’t make excuses here. Can I take ten minutes with you after this to walk through what went wrong and what we’re changing?","f":{"if":"they say “That’s what you said last time”","say":"It is, and that’s fair. The difference this time is [structural change, such as a named owner and a check two days out]. If it slips again, come straight to me."},"why":"Label the emotion, own it once, then move to the fix. Defending your team in the moment escalates; a credible change de-escalates.","id":"a016"},{"d":"exec","t":"Missed meeting","s":"Your SVP missed the steering meeting where the client pushed go-live back a month. She has five minutes before her own call with the client’s CEO","r":"Headline: go-live moves to [date], their call, because of [reason]. The tone was [constructive]. They need [ask] from us by [date]. If their CEO brings it up, I’d say [suggested line].","alt":"For your call: go-live is now [date], their decision, driven by [reason]. They want [ask] by [date]. We made no commitments beyond that.","f":{"if":"she asks whether we agreed to anything","say":"Only to send [deliverable] by [date]. They floated [extra request], and I said we’d come back to them once you’d weighed in."},"why":"Brief for the next conversation they’ll have, not the meeting you had: decision, cause, ask, and the line to use.","id":"a017"},{"d":"exec","t":"Keeps you up","s":"At the end of your project review, the chief data officer asks, “What’s the one thing about this that keeps you up at night?”","r":"[Specific risk]. If [trigger] happens, we’d find out late, around [stage], when it’s expensive to fix. I’ve got [mitigation] in place, but I’d sleep better with [specific help from them].","alt":"Honestly, the quality of [upstream source]. Everything downstream inherits it. I’m testing it weekly now, and you’ll hear from me the moment the trend turns.","f":{"if":"they ask what you’d need to fix it","say":"[Owner team] prioritizing [fix] this quarter. It’s about [effort] on their side. A word from you to [their leader] would probably settle it."},"why":"Answer with a real, specific risk, your mitigation, and the help you need. “Nothing, it’s fine” reads as naive or hiding something.","id":"a018"},{"d":"exec","t":"Defend the call","s":"Your manager is out, and a VP asks you to explain why your team dropped [feature] from the release. You argued against cutting it","r":"We cut it to protect [date], because [priority] matters most this quarter. Shipping it meant [trade-off], and [manager] judged the date was worth more. It’s in [next release], and I’m tracking [impact] until then.","alt":"There was real debate, and I argued to keep it. The call was to protect [date], and I’m fully behind delivering it. [Manager] can walk you through the full reasoning on [day].","f":{"if":"they ask whether you think it was the right call","say":"I’d have weighed it differently, and I said so at the time. But the reasoning holds up, and my job now is making sure we don’t lose [impact] in the gap."},"why":"Disagree in the room, commit outside it. Represent the decision with its real reasoning; your earlier objection isn’t a shield.","id":"a019"},{"d":"exec","t":"Crisp close","s":"You’re five minutes from time with a group EVP who has a hard stop, and the discussion has wandered. Nothing has actually been decided yet","r":"I know you’ve got a hard stop, so let me propose where we’ve landed: we go with [option], and [owner] has [action] by [date]. Does that match your view?","alt":"Before you go, one question: are you comfortable with us going ahead on [option]? If yes, I’ll send the plan this afternoon.","f":{"if":"they say “Let me think about it”","say":"Of course. What’s the open question for you? If it’s [likely concern], I’ll send a one-pager on it tomorrow and grab five minutes Thursday to close it out."},"why":"Propose the conclusion yourself and ask them to correct it. Busy leaders confirm a draft decision far faster than they create one.","id":"a020"},{"d":"room","t":"Tangent","s":"Twenty minutes into your forty-minute pricing meeting, two people are locked in a debate about the CRM migration, which isn’t on the agenda","r":"This is important, and it deserves more than the ten minutes we’d give it here. Can I park it? I’ll set up thirty minutes on the migration this week. For now, back to pricing: [question].","alt":"I’m going to be the clock for a second. We’ve got twenty minutes and one decision to make. Taylor, Marcus, can you two pick the migration up after?","f":{"if":"one of them says the migration affects pricing","say":"Then let’s take just that piece: does the migration change today’s pricing decision, yes or no? If yes, we factor it in now. If not, it waits."},"why":"Park a tangent by honoring it and giving it a home, then restate the decision. People let go once a topic has a slot.","id":"a021"},{"d":"room","t":"Senior clash","s":"In a cross-team review, two directors start arguing about whose forecast is right. Voices are rising, and the people around you are staring at their laptops","r":"Can I try to separate this? I think you agree on [shared point] and differ on [specific assumption]. Jordan, you’re assuming [X]; Priya, you’re assuming [Y]. Is that the real gap?","alt":"We won’t settle this in the room. Can Jordan and Priya take twenty minutes together, agree the key assumption, and bring one number back Thursday?","f":{"if":"one director snaps that it’s not about assumptions, the other model is just wrong","say":"Possibly. Then the fastest way to know is to run both models on last quarter and see which one called it. Can we agree to that test?"},"why":"Turn a clash of people into a question of assumptions, then agree on a test. Objective criteria end fights that positions can’t.","id":"a022"},{"d":"room","t":"Land the rec","s":"You’ve spent weeks analyzing whether to consolidate two data vendors. You have one slide and three minutes at the end of the leadership meeting to get a yes","r":"My recommendation: consolidate to [vendor] by [date]. It saves [amount] a year and cuts [risk]. The cost is [trade-off] during the switch. I’m asking for approval today so we can give notice.","alt":"You’ve each seen the detail, and I’ve walked [key stakeholders] through it in advance. The ask is simple: approve [vendor] so we can give notice by [date].","f":{"if":"someone asks why not [other vendor]","say":"We looked hard at them. They’re stronger on [advantage], but they fall short on [deciding factor], which matters more for us because of [reason]. I’ll share the comparison."},"why":"Recommendation first, then the payoff, the trade-off and the specific ask. Pre-wire the key people so the meeting confirms rather than debates.","id":"a023"},{"d":"room","t":"So what?","s":"You finish walking a room through a detailed cohort analysis, and a senior partner says, “Okay. So what?” Everyone looks at you","r":"So we’re paying to acquire customers who leave by month three, roughly [amount] a year. I’d test moving [share] of that spend to [segment] next quarter and see if retention follows.","alt":"Fair hit, I buried the lead. The point is [implication], and the decision it points to is [decision]. Everything else on those slides is backup.","f":{"if":"they say “We already knew that”","say":"Then the new part is the size: it’s [magnitude], bigger than we’d assumed. That’s what makes [decision] worth doing now rather than next year."},"why":"Translate findings into the decision they change. Data is the evidence, not the message; lead with what to do differently.","id":"a024"},{"d":"room","t":"Silent decider","s":"The whole meeting has built toward a go or no-go, but the VP who owns the call has said nothing for thirty minutes and is checking her phone","r":"Taylor, this one’s your call, so I want to make sure we’ve given you what you need. Where are you leaning, and what’s missing to decide today?","alt":"Let me propose a default: we go ahead on [date] unless you see a reason not to by Wednesday. Taylor, does that work for you?","f":{"if":"she says she needs more time","say":"Understood. What specifically would help: more data on [X], or a conversation with [stakeholder]? I’ll get it to you, and let’s set [day] as the decision date."},"why":"Ask the decision maker where they lean and what they need, by name. Silence usually hides an unspoken objection you can still answer.","id":"a025"},{"d":"room","t":"No owners","s":"Your meeting ends with everyone nodding at “we should fix the onboarding handoff,” and people are standing up. Nobody has said who will do it","r":"Thirty seconds before we go. Who’s taking the handoff fix? Sam, it sits closest to your team. Can you own it and bring a first draft by [date]? I’ll help with [piece].","alt":"I’ll take it. I’ll draft the fix, run it past Sam and Priya, and send it round by Friday. Speak up now if someone’s better placed.","f":{"if":"they say they don’t have the bandwidth","say":"Understood. Could you own just [narrow piece]? I’ll take the rest, and we’ll write down who has what so nothing falls between us."},"why":"Every action needs one named owner and a date before people leave. “We should” without a name means nobody will.","id":"a026"},{"d":"room","t":"No clear goal","s":"You’re ten minutes into an hour-long meeting a peer called, with eight people and no agenda. Nobody seems sure why they’re there","r":"Marcus, help me make sure we use the hour well. What would make this a success for you by the end: a decision, input on a draft, or getting everyone up to speed?","alt":"Can I suggest we write the goal down? I think we’re here to decide [X]. If that’s right, the first question is [Y].","f":{"if":"the organizer says he just wanted everyone aligned","say":"Makes sense. Then let’s name the two or three things we need to agree on and check them off. Anything that’s update only, we can take in writing."},"why":"Clarify the purpose through the organizer, not around them. Asking what success looks like gives a shapeless meeting a finish line.","id":"a027"},{"d":"room","t":"One voice","s":"In a planning session you’re facilitating, one senior analyst has talked for most of the hour while three quieter people with relevant expertise haven’t spoken","r":"Jordan, that’s a strong point, and I’ve captured it. I want to hear from the people closest to the data. Priya, you’ve worked on [area]. What are we missing?","alt":"Let’s go round the table, one minute each, on one question: what’s the biggest risk in this plan? Priya, would you start us off?","f":{"if":"he cuts back in before Priya finishes","say":"Hold that thought, Jordan, it’s noted. Priya, keep going. You were saying [her point]."},"why":"Acknowledge the talker, then redirect by name with a specific question. Changing the format is easier than changing the person.","id":"a028"},{"d":"room","t":"Out of scope","s":"Mid-presentation on your fraud model, a director asks how it affects the firm’s capital requirements, a regulatory topic well outside your scope","r":"That’s outside what I can speak to with confidence, and I won’t guess on a capital question. [Name] in [team] owns it, and I’ll connect you two today.","alt":"What I can tell you is the model’s side: [what it changes in your area]. How that flows into capital is [team]’s call, and I’ll get them to confirm.","f":{"if":"they say “Just ballpark it for me”","say":"I’d rather not, because a ballpark on capital tends to get repeated. I’ll have a real answer from [team] by [day]. Is that soon enough for what you need?"},"why":"Answer the part you own, hand off the rest by name, and refuse to guess on high-consequence topics. Scope discipline signals judgment.","id":"a029"},{"d":"room","t":"Decide now","s":"You’ve presented two options, the debate is done, and the group lead says, “Good discussion, let’s pick this up next week.” Waiting costs you the vendor slot","r":"Before we close, one flag: if we wait a week, we lose [vendor slot], which pushes us to [date]. Is there anything we’d know next week that we don’t know now?","alt":"Could we make a provisional call now, say option A, and I’ll flag it if anything changes by Wednesday? That keeps the slot without locking us in.","f":{"if":"they say they’re not ready to decide","say":"Okay. What would get you there? If it’s [missing info], I’ll have it by tomorrow noon and we can decide in a ten-minute call instead of waiting a week."},"why":"Make the cost of delay explicit and ask what new information waiting would bring. Offer a reversible decision if they hesitate.","id":"a030"},{"d":"room","t":"Play it back","s":"After forty minutes of debate on the data governance plan, people seem to agree, but you suspect each of them is hearing a different version","r":"Let me play back what I think we’ve agreed, and stop me where it’s wrong. One, [point]. Two, [point]. Three, [owner] does [action] by [date]. Does anyone see it differently?","alt":"Quick check, because we may each have a different picture. Sam, how would you describe what we just agreed? Priya, anything you’d add or change?","f":{"if":"someone says “That’s not what I agreed to”","say":"Good, that’s exactly why I asked. What’s the difference? Better we sort it out now than discover it three weeks in."},"why":"Play back the agreement out loud and invite correction. Surfacing disagreement now is cheap; discovering it after work starts is expensive.","id":"a031"},{"d":"room","t":"Salvage it","s":"Fifteen minutes into your pitch to a prospective data partner, their team looks disengaged, one person is openly typing, and their lead’s questions are getting sharper","r":"Let me pause. I’m not sure this is hitting what matters to you. What would make the next twenty minutes worth your time?","alt":"Let me skip ahead. You asked about [their skeptical question], so let’s take that head on. If we can’t answer it, nothing else in this deck matters.","f":{"if":"their lead says they’re honestly not sure this fits","say":"That’s helpful, thank you. What would it need to do to fit? If the answer is something we can’t do, I’d rather know now and save us both the time."},"why":"When a room is going badly, stop presenting and name it. Asking what matters resets the meeting around their agenda, not yours.","id":"a032"},{"d":"room","t":"Kickoff with history","s":"You’re opening a kickoff between Risk and Product for [project]. The last joint project ended in escalations, and both teams walked in with arms folded","r":"Let’s name it: the last project together was hard on both sides. I’d like this one to go differently. Before the plan, can we agree how we’ll make decisions and escalate, so nobody gets surprised?","alt":"Before the plan, one question for each team: what went wrong last time that you’d want to make sure doesn’t happen again? I’ll write both lists up.","f":{"if":"someone says Product ignored every risk flag last time","say":"That’s exactly what we need on the table. So let’s agree now: every risk flag gets a written answer within [two days]. Does that work for Product?"},"why":"Name the history in the first minute and agree working rules before content. Unspoken grievances get litigated through the work instead.","id":"a033"},{"d":"room","t":"Hand off well","s":"You’re presenting to the steering committee, and the next section belongs to Sam, a junior analyst whose work is excellent but who’s never presented to this group","r":"The piece that changed our recommendation came from Sam, who found [finding] in [data]. Sam, can you walk everyone through how you spotted it?","alt":"Sam built this section and knows it better than I do. Sam, start with the headline: what should the committee take away?","f":{"if":"a committee member asks Sam a tough question and Sam hesitates","say":"Good question. Sam, do you want to take the first part, on [what Sam knows], and I’ll add the context on [other part]?"},"why":"Hand off with specific credit and an easy opening question. Credit builds their standing; the easy question settles nerves before hard ones.","id":"a034"},{"d":"room","t":"Buy time","s":"A board-level stakeholder asks you a pointed question about your forecast’s downside case. You know the answer, but it needs a moment’s thought to say well","r":"Let me make sure I answer the right question. Are you asking how bad the downside gets, or what would trigger it?","alt":"There are really two parts to that: how big the downside is, and how early we’d see it coming. Let me take size first.","f":{"if":"they say “Both”","say":"Okay. Size first: in the downside case we land around [range]. The trigger is [leading indicator], which we’d see by [month]. That gives us time to pull [lever]."},"why":"Clarify or signpost to buy thinking time; both sound deliberate. A structured pause reads as rigor, not panic.","id":"a035"},{"d":"room","t":"Cameras off","s":"You’re running a Teams review with fourteen people, every camera is off, and your last two questions to the group got total silence","r":"Let me make this easier than an open question. In the chat, one to five: how confident are you we hit [date]? Then I’ll ask whoever scores lowest what they’re seeing.","alt":"Taylor, you’ve worked on [area] most closely. What’s your read? Marcus, you’re next, on [part].","f":{"if":"the chat stays empty","say":"Okay, I’ll read silence as the plan being clear, so I’ll lock it at end of day. If that’s wrong, message me before five."},"why":"Open questions die on video. Ask for a low-effort response, or call on people by name with a specific question.","id":"a036"},{"d":"room","t":"End early","s":"You’ve hit your goal twenty minutes into an hour-long meeting with five busy directors. Someone starts raising a new, unrelated topic to fill the time","r":"We’ve got what we came for, so let’s give everyone forty minutes back. To confirm: [owner] on [action] by [date], [owner] on [action] by [date]. Jordan, can we give your topic its own slot this week?","alt":"That’s a decision, and early. The recap goes out within the hour. Jordan, is your point quick, or does it need its own meeting?","f":{"if":"the person with the new topic says it’s urgent","say":"Then let’s give it ten minutes now with just the people it affects. Everyone else, you’re free, and the recap will be in your inbox by noon."},"why":"End the moment the goal is met and recap owners and dates aloud. Meetings known to end early get better attendance and attention.","id":"a037"},{"d":"room","t":"Relitigating","s":"Three weeks after the group agreed to sunset the legacy report, Marcus reopens it with a long post in your project’s Teams channel. Two people react with a thumbs-up","r":"Thanks, Marcus. For context, we decided this on [date], and [teams] have planned around it. I’m open to revisiting if something’s changed. What’s new since then? If it’s new data, let’s take it to [decision owner] this week.","alt":"Marcus, can we talk live for ten minutes? I want to understand what’s bothering you before this turns into a fifty-reply thread.","f":{"if":"he replies that it’s the same concern and he still thinks it’s wrong","say":"Understood, and it’s on record. We weighed it last time and chose to proceed. Let’s set a check on [date]: if [the risk] shows up, we revisit with real data."},"why":"Reopen decisions for new information, not repeated arguments. Asking what’s changed separates genuine new risk from second thoughts.","id":"a038"},{"d":"influence","t":"Pre-wire","s":"Thursday’s steering committee decides whether your [model] replaces the legacy scorecard, and Priya, whose team owns that scorecard, hasn’t seen your proposal yet","r":"Priya, before Thursday I’d rather you hear this from me than see it on a slide. Here’s the proposal and what it means for your team. What would worry you if you saw it cold?","alt":"Sending you a draft of Thursday’s proposal before it goes wide. Your team is the most affected, so I’d like your fingerprints on it first. Fifteen minutes Tuesday?","f":{"if":"she raises a concern you can’t fix before Thursday","say":"That’s fair. I’ll put it on the slide as an open risk and say you raised it. Better the room decides with it in plain view than hears it halfway through."},"why":"Pre-wire: no key stakeholder should meet a decision for the first time in the room, because surprise turns into opposition.","id":"a039"},{"d":"influence","t":"Known skeptic","s":"Marcus, a respected principal engineer, has picked apart your last two proposals in open reviews, and your next one won’t get funded without his support","r":"Marcus, you found real holes in my last two proposals, so I want you to go after this one before anyone else sees it. Where would you attack it first?","alt":"Two of your points from last time changed how I built this one. Can I show you where, and what’s still open?","f":{"if":"he says he still doesn’t think it’ll work","say":"Then help me find out cheaply. What’s the one test that would change your mind? If it fails, I’ll drop it. If it passes, I’d like your name behind it."},"why":"Give a skeptic a job, not a fight: invite the attack early and in private, and they shift from opponent to co-author.","id":"a040"},{"d":"influence","t":"Not yet","s":"Your director turns down your [tool] pilot for this quarter, and you suspect the real issue is timing and budget rather than the idea itself","r":"Understood. So I put my effort in the right place: is this a no to the idea, or a no to right now? If it’s timing, what would need to be true for a yes in [quarter]?","alt":"Fair enough. If I come back in [month] with [two teams signed up and the cost halved], would you look at it again?","f":{"if":"they say it’s a no to the idea","say":"That’s useful to know. What part doesn’t land for you? I’d rather understand the objection properly than keep pitching around it."},"why":"Ask what would need to be true. It turns a closed no into a list of conditions you can go and meet.","id":"a041"},{"d":"influence","t":"Cold expert ask","s":"You’re writing to Sam, a fraud-modeling expert in another division who doesn’t know you and is buried in requests, to ask for a short call","r":"Hi Sam, [name] said you’re the person who solved [specific problem]. We’re hitting it on [project]. Could I get twenty minutes next week? I’ll send three questions ahead so it’s quick, and share what we learn.","alt":"Sam, if a call is too much, could I send you three questions about [problem] and take whatever answers you have time for?","f":{"if":"they don’t reply after a week","say":"Sam, bumping this once. If you’re not the right person, the name of someone who is would help as much."},"why":"Make the ask small, specific and easy to say yes to, and hand them a graceful way to say no.","id":"a042"},{"d":"influence","t":"Senior owes you","s":"You run a cross-team workstream, and a director from another group, two levels above you, has missed two deadlines for an input only her team can provide","r":"[Name], I own the [workstream] timeline, so I want to be straight with you: the [input] has slipped twice, and [launch] depends on it. What would make Friday realistic, or should I reset the date with [sponsor]?","alt":"Would it help if my team drafted the [input] and yours reviewed it? I’d rather take work off your plate than keep asking for it.","f":{"if":"she says it’s on her list and she’ll get to it","say":"Thank you. I’ll put Friday in the tracker with your name next to it. If anything changes, a one-line heads-up lets me manage it with [sponsor]."},"why":"Seniority doesn’t cancel a commitment. Name the dependency, offer to lighten their load, and make the date visible.","id":"a043"},{"d":"influence","t":"Clean escalation","s":"You and Jordan in operations have argued for a month over who owns a data-quality fix that’s broken month-end reporting three times, and you’re ready to escalate","r":"Jordan, we’ve both tried and we’re stuck. I’d like us to write it up for [both managers] together: your view, my view, and what waiting costs. Want to draft your half and I’ll draft mine?","alt":"I’m raising this with [my manager] tomorrow. I’m telling you first so it’s no surprise, and I’ll describe your position as fairly as my own. Want to read it before it goes?","f":{"if":"they say escalating will make you both look bad","say":"I get that. To me, letting month-end break a fourth time looks worse. If we frame it as a priority call rather than a complaint, it protects both of us."},"why":"Escalate a decision, not a person: warn them first, present both sides fairly, and frame it as a priority call.","id":"a044"},{"d":"influence","t":"Build a coalition","s":"You want to standardize metric definitions across five analytics teams, and you know a solo pitch to leadership will get a polite nod and nothing else","r":"Marcus, your team loses hours every month reconciling [metric] with ours. I’m pulling a few leads together to fix the definitions once. Would you co-sponsor it with me? Your pain is the best evidence we’ve got.","alt":"Before I take this to leadership, I’m asking each lead one question: what does inconsistent [metric] cost your team? I’ll bring back your answers, with your names on them.","f":{"if":"they say they agree but can’t commit time","say":"Totally fair, and I’m not asking for hours. Would you put your name on the proposal and take two minutes in the meeting on what this costs your team?"},"why":"Build the coalition one-on-one before the big pitch. Leaders fund what several teams ask for, not what one person wants.","id":"a045"},{"d":"influence","t":"Find a sponsor","s":"You’ve built a working prototype that cuts [report] prep from days to hours, and it needs a VP sponsor to spread beyond your team","r":"Before I ask for any budget, I’d like to know if this is worth your name. It saves [team] [hours] every month-end. If it is, I need two things: an intro to [leader] and cover for a two-month pilot.","alt":"Which of your goals this year does this help most? I’d like to shape the pilot around that, so it’s clearly a win for your org too.","f":{"if":"they say it’s interesting but they’re stretched","say":"Then let me keep it light: a ten-minute demo at your staff meeting, and I do all the work. You’d only need to tell me whether it’s worth pursuing."},"why":"Sponsors lend reputation, not hours. Keep the ask specific and small, and tie it to a goal they already own.","id":"a046"},{"d":"influence","t":"Change pushback","s":"You’re moving the team’s reporting from Excel to [BI tool], and the analysts in the room are visibly annoyed because their spreadsheets work fine for them","r":"I know this costs you something: your spreadsheets are faster for you today. Here’s why we’re changing: [the real problem it solves]. I’d like your help finding what’s clumsy, because you’ll spot it first.","alt":"Let’s run it for four weeks, then review it together. If it’s making your days worse with nothing to show for it, we’ll change course, and I’ll say so in this room.","f":{"if":"someone says it’s change for change’s sake","say":"Fair challenge. Here’s what the old way costs: [specific example, like three versions of the same number in one meeting]. If that’s not worth fixing, tell me and I’ll take that back to [sponsor]."},"why":"Name what a change costs people before selling its benefits. Resistance softens when the loss is acknowledged, not dismissed.","id":"a047"},{"d":"influence","t":"First favor","s":"You’re messaging Taylor in finance on Teams for a cost-center extract by tomorrow, and you’ve never worked with them or done them a favor","r":"Hi Taylor, I’m [name] on the [team] analytics side. Could you help with a cost-center extract for [purpose] by tomorrow noon? I know it’s a favor, not your job, so if my team can ever return it, say the word.","alt":"Taylor, who on your team is the right person for a cost-center extract? Glad to go through them if that’s easier than doing it yourself.","f":{"if":"they say they’re swamped until next week","say":"Understood. If I send the exact filters and format, would ten minutes Thursday work? I can also take a partial cut today and fill in the rest myself."},"why":"Be specific, give the reason, and make it cheap to help. Offer reciprocity openly rather than leaving an unspoken debt.","id":"a048"},{"d":"influence","t":"Yes but no","s":"Sam nods along in every project meeting, says “sounds good,” and then nothing happens. It’s the third time, and your timeline is slipping","r":"Sam, I’ve noticed we agree in the room and then the work doesn’t move. Usually that means something’s bothering someone that’s hard to say in a meeting. Is it the priority, the approach, or the timeline?","alt":"Before we close: Sam, what’s the first step on your side, and when should I expect it? I’ll put it in the notes so we’re all working from the same list.","f":{"if":"they say everything’s fine, they’ve been busy","say":"Okay. Then let’s make it easy: what’s a date you’d bet on? If it’s at risk, a heads-up the day before is all I need."},"why":"Silent agreement often hides disagreement. Name the pattern without blame, then turn every yes into an owner and a date.","id":"a049"},{"d":"influence","t":"Gut over data","s":"A veteran sales director dismisses your client attrition analysis: “I’ve been doing this twenty years, I know my clients,” and the rest of the room is watching","r":"Your read on clients is exactly what I want to test this against. Where does the data match what you’re seeing, and where does it look wrong to you? Those gaps are usually the most useful part.","alt":"Let me show you three clients the model flagged last quarter. If your gut already had all three, the model isn’t adding much, and I’ll say so.","f":{"if":"they say the numbers are simply wrong","say":"Could be. Pick one client you know well and we’ll walk through how they got scored. If the logic’s off, I want to fix it before anyone relies on it."},"why":"Don’t fight experience with charts. Turn their intuition into the test, and use specific cases they recognize.","id":"a050"},{"d":"influence","t":"Opposing goals","s":"Your project sits between marketing, which wants every customer attribute kept, and privacy, which wants the minimum, and both leads expect you to take their side","r":"I don’t think you two disagree on the goal: campaigns that work and no regulatory problems. Can we list which fields actually drive results, then decide each one on its merits instead of all or nothing?","alt":"Before we meet, I’m asking you both the same thing: what’s the one thing you can’t give up, and what would you trade if the other side moved?","f":{"if":"one lead says the other side is being difficult","say":"I hear the frustration. I’ve asked them the same question, and they have real constraints too. Let’s put both lists side by side and see where they overlap."},"why":"Move from positions to interests, find the goal both sides share, then break one big fight into small decisions.","id":"a051"},{"d":"influence","t":"Stolen idea","s":"Twenty minutes after the room ignored your suggestion to segment by product line, Jordan says the same thing and the director calls it “a great point”","r":"Glad that’s landing, Jordan. It builds on what I raised earlier about [product line], so let me take it a step further: if we segment that way, the next decision is [next step].","alt":"Yes, that’s the point I made earlier, and I’m glad it’s getting traction. I’ve already sketched how the cut would work and can walk everyone through it now.","f":{"if":"the director’s recap email credits Jordan alone","say":"Glad the product-line cut is moving. Since I raised it and have a breakdown started, I’ll own the first version and get it to you by Thursday."},"why":"Reclaim credit by building on the idea out loud, never by accusing. Owning the next step makes authorship obvious.","id":"a052"},{"d":"influence","t":"Via your boss","s":"You think your skip-level is about to fund the wrong platform, and you need your manager to carry your concern up without you going around them","r":"I’ve got a concern about the [platform] decision, and I’d rather you take it to [skip-level] than have me go around you. Here’s a one-page version you can use as yours or send as mine, whichever helps more.","alt":"What does [skip-level] care about most right now? I want to frame this in their terms so it’s easy for you to raise, not another problem on your plate.","f":{"if":"your manager says it’s not worth the political capital","say":"That’s your call, and I’ll respect it. Would it change your mind if [the migration risk] were in numbers? If so, I’ll have them to you by Wednesday."},"why":"Go through your manager, not around them: hand them something short they can reuse, framed in the senior person’s priorities.","id":"a053"},{"d":"influence","t":"Always done it","s":"You suggest automating the monthly reconciliation, and a long-tenured colleague says, “We’ve always done it this way, and it’s never failed”","r":"That track record is worth protecting. What’s the part of the current process that’s kept it from failing? I’d want anything new to keep that, and only change the parts that eat your time.","alt":"Then let’s run both side by side for one close. If the automated version misses anything yours catches, we keep yours, and you’re the one judging.","f":{"if":"they say automating it is too risky","say":"Agreed, risk is the right worry. What would you need to see in the parallel run to trust it? Let’s write that down now as the bar."},"why":"Honor what the old way protects before proposing change. Lower the risk of trying, and let the evidence argue.","id":"a054"},{"d":"influence","t":"Early input","s":"You’re about to redesign how your analytics team prioritizes requests, and the analysts are already wary of another process handed down from above","r":"Before I draw anything, I want to hear where today’s process breaks for you. What should the new one fix first, and what must it not break? I’ll bring back a draft built from your answers.","alt":"Draft one is deliberately rough so you can tear it up. Comment by Friday, and I’ll show you what changed because of what you said.","f":{"if":"nobody says anything in the meeting","say":"Fair, it’s hard to react to a blank page. I’ll message each of you one question: what’s the most annoying part of how requests work today? Two lines is plenty."},"why":"Ask before you draft. People defend what they helped build, and they can only help build what’s still unfinished.","id":"a055"},{"d":"influence","t":"Moving target","s":"Priya, the product owner on the client side, has changed the reporting specs three times in two weeks, and each change sends your team back to rebuild","r":"Priya, each change has made sense on its own, but together they’ve reset us three times. Can we spend thirty minutes on the decision this report needs to support? Then I can tell which changes matter now and which go in version two.","alt":"From here, let’s lock version one by Friday. Any change after that goes on a list, and I’ll show you what each costs in days before we take it on.","f":{"if":"she says her leadership keeps changing its mind, not her","say":"That makes sense, and it puts you in a tough spot. Could we get [her sponsor] into one session to agree the core specs, so you’re not relaying every shift?"},"why":"When requirements churn, anchor on the decision the work serves, then make the cost of each change visible.","id":"a056"},{"d":"influence","t":"Compliance no","s":"Your compliance partner emails back a flat no on using client transaction data for a new model, citing “policy” without saying which policy or what would fix it","r":"Thanks for flagging it early. I want to get this right, not get around you. Which part of the policy is the concern: the data itself, who can access it, or how it’s used? Then I can design controls that meet it.","alt":"What would a version you could approve look like? If it’s masked data, a smaller pilot, or your team reviewing outputs, I’ll build it that way from the start.","f":{"if":"they say it would need legal review, which takes months","say":"Understood. Could we send legal the narrowest version first, [masked data, one use case], so they’re reviewing something small? I’ll write it up so it’s quick for them."},"why":"Treat risk partners as designers of the yes, not gatekeepers. Ask what a compliant version looks like, then build that.","id":"a057"},{"d":"influence","t":"Get it read","s":"Your ten-page proposal has sat unanswered in a managing director’s inbox for two weeks, and the budget window closes at month-end","r":"Subject: Decision needed by [date]: [proposal] (two-minute read). The ask: [decision]. Why now: [budget window]. Cost: [amount]. What you get: [outcome]. The full proposal is attached, but these four lines are enough to decide.","alt":"Could I take five minutes at the end of your next staff meeting? One slide, one decision. If it’s a no, you’ve saved yourself ten pages.","f":{"if":"they reply “send me something shorter”","say":"Will do. Here’s the one paragraph: [ask, cost, deadline, outcome]. If you want a single number to judge it by, it’s [metric]."},"why":"Senior readers triage by subject line. Put the decision, deadline and cost where they’ll see them, and make the detail optional.","id":"a058"},{"d":"pushback","t":"At capacity","s":"Your manager drops a new analysis on you Friday afternoon, and you’re already committed to two deliverables due next week that she also called top priority","r":"Happy to take it on. Something has to give, though: [deliverable A] and [deliverable B] are both due Thursday. Which one slides, or should someone else pick this up?","alt":"If this is now the top priority, I’ll start it Monday and move [deliverable B] to next Friday. Does that work, or does B have to hold?","f":{"if":"she says all three need to happen next week","say":"Then here’s what’s realistic: A on Thursday, a rough cut of this on Friday, B the following Tuesday. If one of those dates won’t fly, tell me which and I’ll cut scope."},"why":"Don’t refuse; make the trade-off visible and hand the priority call back. Capacity talks go better as choices than as nos.","id":"a059"},{"d":"pushback","t":"Impossible date","s":"In a steering meeting, the managing director says she wants the new attribution model live by month-end. Your team’s honest estimate is ten weeks","r":"I want to hit that. Here’s what month-end can be: [scope A], live and validated on one product line. The full model is ten weeks. Which matters more to you, the date or the full scope?","alt":"Can I come back tomorrow with two options, one that hits month-end and one that’s complete, so you can pick with the trade-offs in front of you?","f":{"if":"she says she needs both, no compromise","say":"Then I need [two analysts] or [the Q3 refresh] taken off our plate to get close. Without one of those, I’d be promising a date I can’t stand behind, and you’d find out late."},"why":"Split the date from the scope and let the senior person choose. A credible no today beats a broken yes in six weeks.","id":"a060"},{"d":"pushback","t":"Private dissent","s":"Your manager plans to announce a team reorg on Monday. You think splitting the reporting team will double the handoffs on every client deliverable","r":"Can I push on one part of the reorg before Monday? I think splitting reporting doubles the handoffs on client deliverables. Let me show you where, and whatever you decide, I’ll back it.","alt":"What problem is the split solving? If it’s [problem], I think there’s a version that gets you there without adding a handoff. Can I sketch it for you?","f":{"if":"they say the decision’s already made","say":"Understood, and I’ll back it with the team. Can we set a 60-day check on turnaround time? If the handoffs bite, we’ll see it early instead of in a client complaint."},"why":"Dissent in private, early and specific, and say up front you’ll commit either way. That makes your disagreement safe to hear.","id":"a061"},{"d":"pushback","t":"Peer disagreement","s":"In a cross-team review, Priya proposes rebuilding the forecasting pipeline from scratch. You think a targeted fix gets most of the benefit in a fraction of the time","r":"Priya, I agree the pipeline’s the bottleneck. Where I see it differently is the fix. A targeted patch on [component] could get us most of the gain in weeks. Can we test that before we commit to a rebuild?","alt":"What would we have to believe for the rebuild to beat a patch? If we can name that, we can check it this week and stop debating.","f":{"if":"she says a patch will break again in a month","say":"That’s a fair risk, so let’s make it the test. Patch it, track failures for a month, and if it breaks again, the rebuild case writes itself and I’ll back it."},"why":"Agree on the problem out loud before you contest the solution. It keeps a peer disagreement about the idea, not about who wins.","id":"a062"},{"d":"pushback","t":"Credit taken","s":"In a leadership review, Marcus presents the churn analysis you built over three weekends as “something I put together,” and the VP is clearly impressed","r":"Glad it’s useful. I built the cohort model underneath it, so happy to take the technical questions. The part that surprised us most was [insight], and it’s worth a closer look.","alt":"(Privately, after) Marcus, in the review it came across as your analysis. I want us clear on who built what. Next time, name me, or let me present the model.","f":{"if":"he says he didn’t mean anything by it","say":"I believe you. It still matters how it lands with leadership, so let’s agree now: whoever built it presents it or gets named. Fair?"},"why":"Reclaim credit by showing depth in the moment, not by accusing. Address the pattern one-on-one, where it can actually change.","id":"a063"},{"d":"pushback","t":"Interrupted again","s":"For the third time in one meeting, Sam cuts in before you finish, and the room starts following his tangent instead of your point","r":"Sam, hold that for a second. I want to finish this because it answers part of your question. (Finish the point.) Okay, go ahead, what were you going to say?","alt":"(One-on-one, after) Sam, I got cut off a few times today and lost the thread. Can you let me land my point before jumping in? I’ll do the same for you.","f":{"if":"he talks over you again anyway","say":"Sam, I’m not finished. Give me thirty seconds and the floor’s yours. (Then keep going, same pace, no apology.)"},"why":"Hold the floor calmly and by name, without heat. An even pace signals more status than a raised voice.","id":"a064"},{"d":"pushback","t":"Condescending reply","s":"On a project thread, Taylor answers you
