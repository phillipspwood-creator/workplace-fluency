y] through a few cycles. What’s one thing you’d tell someone starting out now that nobody told you?","alt":"Okay, table question: best or worst business trip you’ve ever been on? I’ll go first, because mine involved [short, funny setup].","f":{"if":"she gives a one-word answer and goes back to her phone","say":"(Don’t chase her.) Sam, earlier you started telling me about [thing] and we got interrupted. I want the ending."},"why":"Revive a quiet table with questions that invite stories or advice, or go first yourself. People reconnect through narrative, not facts.","id":"a156"},{"d":"social","t":"Remembered detail","s":"Waiting for a review to start, you’re alone with an SVP stakeholder who, three weeks ago, mentioned she was training for her first half marathon","r":"Wasn’t your half marathon around now? How did it go, and more importantly, how are the legs?","alt":"(On Teams, the Monday after the race) Hope the half marathon went well. Did you hit the time you were aiming for?","f":{"if":"she says it went badly and she got injured","say":"Oh no, that’s rough after all that training. Are you going to have another go, or has it put you off for good?"},"why":"Recalling a specific detail proves you listened. Ask an open question about how it went, rather than showing off your memory.","id":"a157"},{"d":"social","t":"Name gone","s":"At an industry event, you’re deep in conversation with someone you’ve met twice before, and your boss walks up expecting an introduction. Their name is gone","r":"Taylor, have you two met? We’ve been talking about [topic], and I think you’ll want to hear this.","alt":"My brain has just dropped your name, and I refuse to bluff. Remind me? I’m [your name], in case yours did the same.","f":{"if":"they remind you, a little coolly","say":"[Name], thank you. Taylor, [Name] runs [team] at [company] and has the sharpest take on [topic] I’ve heard all night."},"why":"Get them to say their own name, or own the slip once, then make a generous introduction. The intro is what they’ll remember.","id":"a158"},{"d":"social","t":"Joining the circle","s":"At a leadership reception, three MDs are mid-conversation by the window. You want to be in it, but walking up feels like interrupting a closed meeting","r":"(Stand at the edge, listen, and wait for a pause.) That’s interesting on [their topic]. We saw something similar in [your area] last quarter. Does it play out the same way on your side?","alt":"Mind if I join you? I caught the words [topic] from across the room, and I’ve got a question about it.","f":{"if":"they finish their point and carry on as if you’re not there","say":"(Keep listening, then catch the speaker’s eye.) Can I ask the obvious question? If you were starting that from scratch, what would you do differently?"},"why":"Enter by adding to their topic, never by changing it. A good question earns you a place faster than an introduction does.","id":"a159"},{"d":"social","t":"Graceful exit","s":"You’ve had ten good minutes with the division head at a reception, the conversation is starting to loop, and you don’t want to be the person who overstays","r":"I won’t keep you. There’s a line of people who’d like ten minutes with you. Thank you. What you said about [specific point] is going to change how I run [project].","alt":"Let me let you circulate. Would it be all right if I sent you a short note on [topic] next week? I’d value your eye on it.","f":{"if":"they say “no, stay, I’m hiding from the crowd”","say":"Then I’m happy to be your cover. Tell me more about [something they mentioned]. I want the version that didn’t make the town hall."},"why":"Exit while energy is high: give them a reason that serves them, name one specific takeaway, and leave before they need rescuing.","id":"a160"},{"d":"social","t":"The job question","s":"At a charity gala your firm sponsors, the surgeon seated beside you asks “So what do you do?” and “data and analytics” is about to end the conversation","r":"I’m basically a detective with spreadsheets. I dig into [customer data] to work out things like who’s about to leave and why, before it happens. Is there such a thing as a normal day in surgery?","alt":"Ever had your bank flag a weird charge before you noticed it yourself? I work on the kind of analysis behind moments like that.","f":{"if":"they say “oh, numbers, I could never do that”","say":"Honestly, the numbers are the easy bit. The hard part is probably the same as yours: getting people to act on something you can see and they can’t."},"why":"Describe the problem you solve in terms a layperson has felt, add one human hook, then hand the question back.","id":"a161"},{"d":"social","t":"The plus-one","s":"At the holiday party, your manager steps away and leaves you with his partner, who you’ve never met and who clearly knows nobody else in the room","r":"Good to meet you properly. You’ve probably heard enough work talk tonight to last a year, so I’ll spare you. What keeps you busy when you’re not being dragged to these?","alt":"Come and meet Priya. She’s the best company in the room and talks less shop than anyone here.","f":{"if":"they ask what working with their partner is really like","say":"Honestly? [One true, specific positive, e.g. he backs his people in the room]. Though I suspect you get the unfiltered version at home, which is more than we get."},"why":"With a plus-one, drop the work talk, connect them to people, and if asked about their partner, give one true, specific positive.","id":"a162"},{"d":"social","t":"Big announcement","s":"Your CEO announced a major acquisition at the town hall this morning, and now you’re in the elevator with her, just the two of you","r":"Congratulations on today. I’d guess the announcement is the easy part. What’s the first thing you’ll be watching as the integration gets going?","alt":"(On Teams, later that day) Congrats on today. The point about [specific detail] stuck with me, because it changes how we should think about [your area].","f":{"if":"she says “thanks, now the hard part starts”","say":"It does. What’s the one thing you’d most want people like me to get right in the first ninety days?"},"why":"Congratulate the work, not the person, then ask a forward-looking question. Peers talk about what’s next; fans talk about how great it was.","id":"a163"},{"d":"social","t":"Not into it","s":"Before a cross-team workshop, you try small talk with an engineering lead whose team you’ll need next quarter. He answers in single words, eyes on his laptop","r":"Looks like you’re in the middle of something, so I’ll leave you to it. Before we start, is there one thing you need out of today? I’ll make sure we get to it.","alt":"Quick one, since you’re the person who’d know: is [system] really as painful to change as everyone says?","f":{"if":"he says “I’m good, thanks” and keeps typing","say":"(Leave it. After he makes a point in the session:) That point on [his point] was useful. Could I grab fifteen minutes next week to understand it properly?"},"why":"Some people hate small talk but respect usefulness. Match their mode, release them gracefully, and build rapport through their expertise later.","id":"a164"},{"d":"social","t":"Opening minutes","s":"You’re hosting a client’s team on video for a quarterly business review. Two of four have joined, the decision maker hasn’t, and the silence is getting long","r":"While we give Jordan a minute: Sam, last time you mentioned [their initiative] was about to go live. How’s it landing with your team?","alt":"We’ll give Jordan two more minutes. In the meantime, what’s the one thing you most need out of today? I’d rather know now than find out at minute fifty.","f":{"if":"the decision maker, Jordan, joins mid-answer, apologizing for running late","say":"No problem, perfect timing. Sam was just telling us about [topic], which ties right into today. Sam, want to finish that thought?"},"why":"Use the minutes before business to surface what’s on the client’s mind. Small talk about their world doubles as discovery.","id":"a165"},{"d":"social","t":"Long flight","s":"You’re seated next to your group head on a three-hour flight to a client site. She’s just closed her laptop, and the next move is yours","r":"Can I steal twenty minutes of this flight? I’m working on getting better at [skill, e.g. presenting to the exec committee]. What did you have to learn the hard way?","alt":"No pressure to talk, I know flights can be the only quiet time you get. If you’re up for it later, I’d love your take on [topic].","f":{"if":"she says she’d rather rest for a while","say":"Of course. (Leave it completely. Near landing:) Anything you’d want me to watch for in the room today?"},"why":"Ask permission, then ask about lessons rather than gossip or status. Captive time rewards depth, and an easy opt-out keeps it comfortable.","id":"a166"},{"d":"phrases","t":"What needs to be true","s":"Your MD floats moving the whole reporting stack to a new vendor by year end. You think it can’t work, and a flat no would make you the blocker","r":"Let’s test it properly. What would need to be true for us to hit year end? My list starts with [migration done by Q3] and [vendor sign-off within six weeks].","alt":"(To a partner who keeps stalling) What would need to be true for you to say yes to this in Q1?","f":{"if":"the MD says “all of that, so make it happen”","say":"Then let’s check each one. [Condition one] depends on [team], and they’re booked through Q3. If you can free them up, I’m in. If not, the realistic date is [date]."},"why":"It turns a yes-or-no standoff into a shared list of conditions, so the idea gets tested on evidence instead of opinions.","id":"a167"},{"d":"phrases","t":"Let me play that back","s":"A partner bank’s product lead has spent ten minutes on a call describing a messy data-sharing requirement, and you’re not sure you’re both picturing the same thing","r":"Let me play that back to make sure I’ve got it. You need [data set] daily, not monthly, and the real driver is [their deadline], not the dashboard. Have I got that right?","alt":"(Email, right after the call) Playing back what I heard so we’re aligned: [point one], [point two], [point three]. If I’ve missed anything, reply here and I’ll correct it before we build.","f":{"if":"she says “mostly, but daily is really a nice-to-have”","say":"Good catch, that changes the build a lot. So monthly is the requirement and daily is phase two. I’ll write it up that way today."},"why":"Restating in your own words exposes misunderstandings early and makes people feel heard, which buys goodwill for the trade-offs later.","id":"a168"},{"d":"phrases","t":"What I’d recommend, and why","s":"Your draft memo to the VP on fixing a reporting delay ends with “each option has pros and cons,” and you realize you’ve handed the thinking back to her","r":"Here’s what I’d recommend, and why. Option B. It fixes the delay in [three weeks] without new headcount. The risk is [risk], and I’d manage it by [mitigation].","alt":"(Top of the email) Recommendation: B. Why: fastest fix, no new headcount. What it costs: [trade-off]. Detail on A and C below if you want it.","f":{"if":"she says “I was leaning towards A”","say":"A’s solid if [condition] matters most. My worry is [specific risk]. If you’re comfortable with that, A works and I’ll make it happen."},"why":"Options without a recommendation hand the thinking back to your boss. Committing to a view, with reasons and risks, is what reads as senior.","id":"a169"},{"d":"phrases","t":"Disagree and commit","s":"Right after choosing the plan you argued against, your director turns to you in front of the group: “Can you live with this?”","r":"Yes. I’ll disagree and commit. I still see the risk in [X], and I’m all in on making this plan work. Can we set one checkpoint at [date] to see whether that risk shows up?","alt":"I can. My concern’s on the record, and from here it’s our plan. The team will hear that from me today.","f":{"if":"the director asks what the checkpoint would look like","say":"If [metric] is below [threshold] by [date], we revisit. If it’s above, I’ll be the first to say I called it wrong."},"why":"Say the commitment out loud, in the room. A named checkpoint turns your doubt into data instead of a grudge.","id":"a170"},{"d":"phrases","t":"One-way or two-way door?","s":"Your team has spent three meetings debating which dashboard layout to pilot with one business unit, and the indecision now costs more than either option","r":"This is a two-way door. If the pilot layout is wrong, we change it in a week and nobody outside this room notices. Let’s pick B today and review in two weeks.","alt":"Before we sign, I want to flag that this one’s a one-way door. Once client data moves to the new platform, unwinding it takes months. It’s worth one more review.","f":{"if":"someone worries that changing it later will confuse users","say":"Fair. Then we tell the pilot group upfront it’s a test and we’ll change things based on their feedback. That turns the risk into a reason for them to engage."},"why":"Sorting decisions by reversibility tells the room how much care each one deserves: move fast through two-way doors, slow down at one-way ones.","id":"a171"},{"d":"phrases","t":"The decision we need today","s":"Forty minutes into an hour-long steering meeting, five senior people have debated the data platform from every angle and nobody has proposed anything concrete","r":"This has been useful, and I want to make sure we leave with something. What’s the decision we need today? As I see it, it’s whether we fund the [option] pilot, yes or no.","alt":"(In the invite, before the meeting) The decision we need on Thursday: approve [option], or send it back for a revised plan. Everything in the pre-read supports that one call.","f":{"if":"a senior person says “we’re not ready to decide”","say":"Understood. Then what would we need to see to decide, and by when? I’ll own getting it, and we’ll put the decision on the [date] agenda."},"why":"Naming the decision converts open-ended debate into a choice with an owner, and it’s a respectful way to steer a room of senior people.","id":"a172"},{"d":"phrases","t":"I want to pressure-test that","s":"A peer presents a forecast showing a big revenue lift from a pricing change, and the room is ready to approve it. The assumptions look thin to you","r":"I’d love this to be right, so I want to pressure-test it before we commit. What happens to the number if [churn] comes in at last year’s level instead?","alt":"(Teams, to the peer, two days before) Before Thursday, can I pressure-test the forecast with you? Better we find the soft spots together than have someone find them in the room.","f":{"if":"the peer gets defensive: “we’ve already been through all this”","say":"I believe you, and I’m not doubting the work. I want us to have the answer ready when [exec] asks, because she will. Walk me through that one assumption?"},"why":"Framing scrutiny as protecting the idea, not attacking it, lets you challenge a popular proposal without making it personal.","id":"a173"},{"d":"phrases","t":"Help me understand...","s":"Your manager tells you your project is being deprioritized, effective immediately, with no reason given. You’re frustrated and about to say something you’d regret","r":"Okay. Help me understand what changed. I want to give my team the real reason, and I’d like to know what would bring it back.","alt":"(To a client who just turned down your proposal) Help me understand how you weighed it. Was it the cost, the timing, or how we scoped it?","f":{"if":"they say “it came from above, I don’t have the full picture”","say":"Fair enough. Would you be up for asking? Even one line on the reason helps me keep the team motivated, and I’d rather hear it from you than the rumor mill."},"why":"It turns frustration into a request for information, keeping you curious instead of combative while you find out what’s really driving the decision.","id":"a174"},{"d":"phrases","t":"What am I missing?","s":"You’re convinced a peer team’s proposal duplicates your team’s work. It goes to your shared VP on Friday, and they’re too smart to have missed it","r":"From where I sit, this looks a lot like what [your team] already does with [system]. You’ve clearly thought about it, so what am I missing?","alt":"(About your own plan, in a room) That’s my recommendation. Before we lock it, what am I missing? Priya, you’ve seen this go wrong before. Where would you poke?","f":{"if":"they explain a real difference you hadn’t seen","say":"That’s the piece I didn’t have, thanks. So the overlap is only [part]. Can we agree who owns that before Friday, so the VP sees one plan?"},"why":"Stating your view, then genuinely asking what you’re missing, lets you challenge without accusing, and often you’re the one who learns something.","id":"a175"},{"d":"phrases","t":"Separate what from how","s":"A peer lead wants both your teams in a daily stand-up to fix missed handoffs, and your team is already groaning about yet another meeting","r":"I’m with you on the problem. Let’s separate the what from the how. The what is zero missed handoffs. Can we each bring one way to get there and pick the lightest?","alt":"(To a business partner who’s specified the solution) Before we commit to [her solution], can we separate the what from the how? Tell me the outcome and the date, and I’ll bring two ways to get there.","f":{"if":"the peer says “stand-ups worked on my last team”","say":"They might work here too. Let’s run it for two weeks with a clear test: if missed handoffs drop, we keep it. If not, we try the shared tracker."},"why":"Agreeing the outcome before the method stops people fighting over solutions and lets the people doing the work own how it gets done.","id":"a176"},{"d":"phrases","t":"What does good look like?","s":"Your new skip-level hands you a vague mandate to “sort out” data quality across three teams, with no metrics and a review in ninety days","r":"Glad to take this on. Before I start, what does good look like to you in ninety days? If we were celebrating at the review, what would have changed?","alt":"(Kicking off with a client) So we’re measuring the same thing: what does good look like for your team six months from now? I’d like to write it down and hold us to it.","f":{"if":"they say “you’re the expert, you tell me”","say":"Happy to. I’d propose [metric one] and [metric two], with [target]. I’ll send it in writing by Friday, and if it matches your picture, that’s our scorecard."},"why":"It forces vague expectations into a shared, concrete definition of success, so you’re judged against something you agreed rather than something you guessed.","id":"a177"},{"d":"phrases","t":"Given what we know today...","s":"Your VP wants a firm launch date for a new risk model, but validation is still running and two data sources haven’t been signed off","r":"Given what we know today, [date] is realistic. Two things could move it: validation results on [date] and sign-off on [data source]. I’ll confirm or revise the day we have both.","alt":"(Email to a client) Given what we know today, we expect delivery the week of [date]. I’ll update you by [date] either way, so you’re never finding out late.","f":{"if":"the VP says “I need something I can commit to the exec committee”","say":"Then commit to [later date]. That covers the realistic downside. If we land early, you look good, and if we don’t, you haven’t overpromised."},"why":"It gives a clear answer while naming what could change it, so you sound decisive without overpromising on information you don’t have yet.","id":"a178"},{"d":"phrases","t":"The short version is...","s":"On Teams, a VP replies to your long status email with one line: “Too long. Are we on track or not?”","r":"The short version is: on track for [date], one risk, and I need nothing from you yet. The risk is [risk], and I’ll flag it by [date] if it becomes real.","alt":"(In a room, when you’ve gone on too long) Let me give you the short version: we’re a month late, it’s fixable, and the fix needs one decision from this group.","f":{"if":"they reply “what’s the risk exactly?”","say":"[Vendor] may miss their [date] delivery. If they do, we slip two weeks. I’ve already lined up [backup] so it stays at two weeks, not two months."},"why":"It signals respect for their time, forces you to lead with the conclusion, and lets them choose whether to go deeper.","id":"a179"},{"d":"phrases","t":"I’d push back gently on...","s":"In a quarterly review, a sales director says your team’s model is “why we’re losing deals,” in front of your boss and his","r":"I’d push back gently on that. When we looked at the Q3 losses, most came down to [reason], not the model. Let’s go through the three biggest together this week and settle it.","alt":"(Comment on a peer’s draft) I’d push back gently on the six-week timeline. It assumes [assumption], which we haven’t confirmed. Could we say [eight weeks], or make the assumption explicit?","f":{"if":"he doubles down: “I’m telling you what my team hears every day”","say":"I believe you’re hearing it, and that matters. Let’s pull ten of those deals together and see what the data says. If the model’s the problem, I’ll fix it."},"why":"Soften the delivery, never the substance. It lets you disagree with someone senior in public without making them defend their pride.","id":"a180"},{"d":"phrases","t":"Can we park that?","s":"Twenty minutes into a client workshop meant to agree scope, their IT lead pulls the room into a detailed debate about one field’s naming convention","r":"That’s a real issue and I don’t want to lose it. Can we park it and come back to it at the end? I’m adding it to the list on the board so it doesn’t vanish.","alt":"Let’s park that and give it the time it deserves. Marcus, could you and I take twenty minutes on it tomorrow, then bring the answer back to this group?","f":{"if":"the IT lead insists “no, it’s blocking everything else”","say":"Then let’s give it five minutes now. What’s the one decision we need to keep moving? We’ll settle the rest tomorrow."},"why":"Parking a tangent visibly, with a promise to return, keeps the meeting on track while signaling the issue still matters.","id":"a181"},{"d":"phrases","t":"Who else should be involved?","s":"You and a peer have just agreed a fix for a broken data feed, and you realize three other teams consume that feed and none of them know","r":"Before we ship this, who else needs to be in this? At least [team A], [team B] and [team C] use that feed, and I’d rather they hear it from us than from a broken report.","alt":"(Before a pitch to leadership) Who else needs to be in this before we take it to [exec]? I don’t want anyone seeing it for the first time in that room.","f":{"if":"the peer says “it’s a tiny change, nobody will notice”","say":"Probably. But if one downstream report breaks at month end, it’s a big deal for them. A two-line heads-up costs us nothing. I’ll draft it now."},"why":"Asking early who’s affected prevents surprises, builds allies before decisions land, and stops a good fix becoming someone else’s incident.","id":"a182"},{"d":"phrases","t":"What’s the cost of waiting?","s":"Your director keeps deferring the fix for a known data quality issue “until after year end,” and you can see the cost building every week","r":"Before we push it again, what’s the cost of waiting? By my count it’s [hours] of manual fixes a week, plus [risk] if anyone audits the numbers. Over three months, that’s [more than the fix].","alt":"(To a client who wants more time) Totally fair to take time. It might help to ask what waiting costs you: is anything getting harder or more expensive while this sits?","f":{"if":"the director says “year end is too busy to take on anything new”","say":"Agreed, so let’s make it small. A two-week patch for the worst of it now, and the full fix after year end. That removes most of the risk."},"why":"Inaction feels free until you price it. Making the cost of delay concrete turns “later” into a trade-off someone has to own.","id":"a183"},{"d":"phrases","t":"That’s a fair challenge","s":"Presenting your budget request, a skeptical CFO says your projected savings “look like wishful thinking,” and the room waits to see how you react","r":"That’s a fair challenge. The savings rest on two assumptions: [assumption one] and [assumption two]. If either is wrong, the number drops to [conservative figure], and the case still holds.","alt":"That’s a fair challenge, and you’re right on [part]. I was too optimistic on the timeline. The savings themselves hold up, and here’s why.","f":{"if":"the CFO says “I still don’t buy it”","say":"Understood. Would you approve a smaller first phase, [amount], with savings measured at ninety days before the rest is released? Then the numbers make the case, not me."},"why":"Acknowledging the challenge first lowers the temperature and shows confidence, so your evidence lands instead of sounding defensive.","id":"a184"},{"d":"phrases","t":"I don’t have that yet","s":"On a call with a partner bank, their CFO asks for your fraud-loss rate on a product line you don’t cover, and your team lead is watching how you handle it","r":"I don’t have that yet, and I’d rather give you the right number than a close one. I’ll get it to you by [time tomorrow], with how it compares to [benchmark].","alt":"(Teams, to a partner) Good question. I don’t have that cut yet. I’ll get it to you by Thursday noon, and if it changes the picture, I’ll call rather than email.","f":{"if":"she presses: “ballpark?”","say":"If a range helps: somewhere between [X] and [Y], based on [proxy]. Treat it as directional, and I’ll confirm the real figure by [time]."},"why":"A specific deadline turns not knowing into reliability. Guessing in front of senior people costs more credibility than a clean “I’ll find out.”","id":"a185"},{"d":"phrases","t":"Building on what [name] said","s":"In a leadership meeting, a quieter peer makes a strong point that gets talked over, and you have a related idea you want to add","r":"Building on what Priya said a minute ago, because I think it got lost: if we [her point], we could also [your addition], which fixes the [problem] we keep coming back to.","alt":"(Email after the meeting) Building on Sam’s point about [topic], I’ve sketched what it could look like in practice. Sam, I’d like you to sharpen it before it goes to [leader].","f":{"if":"the senior person turns to you: “good idea, can you take that forward?”","say":"Happy to, with Priya, since it started as her idea. We’ll come back with a proposal by [date]."},"why":"Building on others out loud amplifies their contribution, makes collaboration visible, and gets your idea heard without competing for airtime.","id":"a186"},{"d":"phrases","t":"In my shoes?","s":"You’re stuck between two senior stakeholders who want conflicting things from your team, and a VP from another division has offered you twenty minutes","r":"Here’s the situation: [stakeholder A] needs [X] by month end, [stakeholder B] needs [Y], and my team can’t do both. What would you do in my shoes?","alt":"(To the stakeholder causing the squeeze) I’ve got [constraint] on one side and your deadline on the other. Honestly, what would you do in my shoes?","f":{"if":"they say “escalate it to your boss”","say":"That’s where I’m leaning. How would you frame it so it doesn’t sound like I’m complaining about either of them?"},"why":"It turns advice into ownership: people invest in problems they’ve helped solve, and you get their judgment, not just their sympathy.","id":"a187"},{"d":"phrases","t":"Where’s the biggest risk?","s":"A vendor’s account team has just walked you through a glossy implementation plan where everything is green, every date looks comfortable, and you’ll own it if it slips","r":"This is clear, thank you. If you had to bet, where’s the biggest risk in this plan? I’d rather hear it from you now than discover it in month three.","alt":"(To your own team before launch) Everything’s green, which makes me nervous. Where’s the biggest risk we’re not talking about? Whoever names it gets thanked, not blamed.","f":{"if":"they say “honestly, we don’t see any major risks”","say":"Then let me ask it differently: on your last project like this, what slipped first? Let’s put a buffer there."},"why":"Asking where the risk is, rather than whether there is one, assumes risk exists and gives people permission to name it.","id":"a188"},{"d":"phrases","t":"Solving the right problem?","s":"Your team is three weeks into building a churn dashboard the business asked for, and you’ve just learned they rarely open the existing one","r":"Before we build the next piece, are we solving the right problem? Hardly anyone opens the current dashboard, so maybe what they need is [a weekly alert], not another dashboard.","alt":"(Client kickoff) Before we scope anything, can we spend ten minutes on whether we’re solving the right problem? What happens today that you most want to stop happening?","f":{"if":"your manager says “they asked for a dashboard, so we build a dashboard”","say":"We’ll deliver what they asked for. Can I spend thirty minutes with two of their users first? If I’m wrong, we lose half an hour. If I’m right, we save weeks."},"why":"Questioning the problem before polishing the solution is the cheapest way to avoid building the wrong thing well.","id":"a189"},{"d":"phrases","t":"What would change your mind?","s":"Your head of finance is firmly against moving forecasting to your team’s new model, and two rounds of arguing have only hardened her position","r":"I don’t think a third round of me arguing helps either of us. What would change your mind? If there’s evidence that would convince you, I’ll go and get it.","alt":"Here’s what would change my mind: if [the model underperforms the current forecast for two months]. What would change yours?","f":{"if":"she says “nothing, I just don’t trust black-box models”","say":"That’s useful, and fair. So it’s less about accuracy and more about explaining the output. If I could show you why it predicts what it does, would that be worth a look?"},"why":"It moves the debate from positions to evidence and reveals whether the real objection is data, trust or something unspoken.","id":"a190"},{"id":"c001","d":"intros","t":"Introductions","s":"You recognize someone from meetings but have never introduced yourself","r":"Hey, I think we've been on a few calls together, but I don't think we've officially met. I'm Alex."},{"id":"c002","d":"intros","t":"Introductions","s":"You meet a colleague from another team","r":"Nice to meet you! What team are you on?"},{"id":"c003","d":"intros","t":"Introductions","s":"You meet a senior leader","r":"Hi, I'm Alex from the analytics team. It's great to meet you."},{"id":"c004","d":"intros","t":"Introductions","s":"You meet a digital colleague in person","r":"It's nice to finally put a face to the name!"},{"id":"c005","d":"intros","t":"Introductions","s":"You join a new team","r":"I just joined the team and wanted to introduce myself. Looking forward to working together."},{"id":"c006","d":"intros","t":"Introductions","s":"You want to introduce yourself in a hallway","r":"Hey, I've been meaning to say hello. I'm Alex."},{"id":"c007","d":"intros","t":"Introductions","s":"You recognize someone but forgot their name","r":"I remember meeting you, but remind me of your name?"},{"id":"c008","d":"intros","t":"Introductions","s":"Someone remembers you but you cannot place them","r":"Good to see you again! Remind me where we last crossed paths?"},{"id":"c120","d":"intros","t":"Introductions","s":"You are introduced by a mutual coworker","r":"Great to meet you! I've heard a little about your team's work."},{"id":"c121","d":"intros","t":"Introductions","s":"You introduce yourself on a cross-functional video call","r":"Hi everyone, I'm Alex from analytics. I'll be supporting the reporting workstream."},{"id":"c122","d":"intros","t":"Introductions","s":"You join a breakout room of strangers","r":"Hey all, I'm Alex. Nice to meet everyone. What teams are you from?"},{"id":"c123","d":"intros","t":"Introductions","s":"You meet someone at an internal networking event","r":"Hey, I'm Alex. What brought you to the event today?"},{"id":"c124","d":"intros","t":"Introductions","s":"You meet someone with a similar title","r":"Oh nice, I'm in analytics too. What area do you focus on?"},{"id":"c125","d":"intros","t":"Introductions","s":"Someone asks what you do","r":"I work in analytics, mostly turning performance data into reporting and insights for our team."},{"id":"c126","d":"intros","t":"Introductions","s":"You want to introduce a teammate to a colleague","r":"Jordan, this is Sam from our team. Sam's been leading the reporting work."},{"id":"c127","d":"intros","t":"Introductions","s":"You join a team you will only support temporarily","r":"I'm Alex, and I'll be partnering with you on this workstream for the next few weeks."},{"id":"c128","d":"intros","t":"Introductions","s":"You meet an executive at a casual office event","r":"Hi, I'm Alex from analytics. It's great to meet you. How's the event been for you?"},{"id":"c129","d":"intros","t":"Introductions","s":"You meet a colleague who already knows your name","r":"Nice to meet you properly! I think we've exchanged a few messages before."},{"id":"c130","d":"intros","t":"Introductions","s":"You are unsure whether you have met before","r":"I think we may have crossed paths, but I don't think we've formally met. I'm Alex."},{"id":"c131","d":"intros","t":"Introductions","s":"You need to introduce yourself in under ten seconds","r":"Hi, I'm Alex from the analytics team. Great to meet you."},{"id":"c108","d":"arrivals","t":"Office arrivals","s":"You see someone at the elevator on Monday morning","r":"Morning! How was your weekend?"},{"id":"c109","d":"arrivals","t":"Office arrivals","s":"You and someone are walking toward the same meeting room","r":"Hey, are you heading to the team meeting too?"},{"id":"c110","d":"arrivals","t":"Office arrivals","s":"A coworker arrives looking rushed","r":"Morning! Looks like a busy start. Hope your day settles down."},{"id":"c111","d":"arrivals","t":"Office arrivals","s":"You see a teammate you have not seen in a month","r":"Hey, it's been a while! How have things been?"},{"id":"c112","d":"arrivals","t":"Office arrivals","s":"Someone holds the elevator for you","r":"Thanks, I appreciate it! How's your morning going?"},{"id":"c113","d":"arrivals","t":"Office arrivals","s":"You walk into a nearly empty office","r":"Pretty quiet in here today, huh?"},{"id":"c114","d":"arrivals","t":"Office arrivals","s":"You run into a teammate in the lobby","r":"Hey, good to see you! Heading up?"},{"id":"c115","d":"arrivals","t":"Office arrivals","s":"You arrive late to an informal team lunch","r":"Hey everyone, sorry I'm a little late. What did I miss?"},{"id":"c116","d":"arrivals","t":"Office arrivals","s":"You see someone leaving for the day","r":"Heading out? Have a good evening!"},{"id":"c117","d":"arrivals","t":"Office arrivals","s":"You see a coworker returning from vacation","r":"Welcome back! How was your trip?"},{"id":"c118","d":"arrivals","t":"Office arrivals","s":"You pass someone whose name you know but have never spoken to","r":"Hey, you're Jordan, right? I'm Alex. I don't think we've met properly."},{"id":"c119","d":"arrivals","t":"Office arrivals","s":"You pass someone while both of you are clearly busy","r":"Hey! Good to see you. Catch you later."},{"id":"c132","d":"arrivals","t":"Elevator and hallway","s":"You have thirty seconds in an elevator with a teammate","r":"Hey, how's your week going so far?"},{"id":"c133","d":"arrivals","t":"Elevator and hallway","s":"Someone mentions they are headed to a presentation","r":"Oh nice, hope it goes well!"},{"id":"c134","d":"arrivals","t":"Elevator and hallway","s":"You are both waiting for an elevator that is taking forever","r":"These elevators are taking their time today."},{"id":"c135","d":"arrivals","t":"Elevator and hallway","s":"You walk with a coworker after a meeting","r":"That was an interesting discussion. What did you think?"},{"id":"c136","d":"arrivals","t":"Elevator and hallway","s":"You pass your manager between meetings","r":"Hey! Hope your day's going well."},{"id":"c137","d":"arrivals","t":"Elevator and hallway","s":"You accidentally start talking as elevator doors open","r":"I'll let you go. Good catching up!"},{"id":"c138","d":"arrivals","t":"Elevator and hallway","s":"You see a teammate with headphones on","tip":"Give a friendly nod or wave; save the conversation for later."},{"id":"c139","d":"arrivals","t":"Elevator and hallway","s":"You run into someone right after their presentation","r":"Nice job on that presentation. Your summary was really clear."},{"id":"c140","d":"arrivals","t":"Elevator and hallway","s":"You are both searching for the same meeting room","r":"Are you looking for the 2 o'clock meeting too?"},{"id":"c141","d":"arrivals","t":"Elevator and hallway","s":"A coworker seems to be in a hurry","r":"Hey! I'll catch you later. Hope the meeting goes well."},{"id":"c009","d":"smalltalk","t":"Greetings","s":"You see a coworker in the morning","r":"Morning! How's your day going so far?"},{"id":"c010","d":"smalltalk","t":"Greetings","s":"You see someone on Monday","r":"Hey, how was your weekend?"},{"id":"c011","d":"smalltalk","t":"Greetings","s":"You see someone on Friday","r":"Happy Friday! Any plans for the weekend?"},{"id":"c012","d":"smalltalk","t":"Greetings","s":"You run into a coworker at coffee","r":"Hey, how has your week been treating you?"},{"id":"c013","d":"smalltalk","t":"Greetings","s":"The office is unusually busy","r":"Looks like we have a full house today."},{"id":"c014","d":"smalltalk","t":"Greetings","s":"There are many meetings this week","r":"It's been a pretty meeting-heavy week."},{"id":"c015","d":"smalltalk","t":"Greetings","s":"You want to make a light observation","r":"Feels like this week has flown by."},{"id":"c016","d":"smalltalk","t":"Greetings","s":"Someone asks how work is going","r":"Pretty well! A few moving pieces, but things are coming together."},{"id":"c017","d":"smalltalk","t":"Greetings","s":"You want to ask about their work casually","r":"What have you been focused on lately?"},{"id":"c018","d":"smalltalk","t":"Greetings","s":"You are waiting for a meeting to start","r":"How has your morning been?"},{"id":"c019","d":"smalltalk","t":"Greetings","s":"You want to ask about the weekend without being intrusive","r":"Did you get a chance to relax this weekend?"},{"id":"c020","d":"smalltalk","t":"Greetings","s":"You see a coworker after a long time","r":"Hey, it's been a while! How have you been?"},{"id":"c152","d":"smalltalk","t":"Days & seasons","s":"Someone asks how your weekend was and nothing happened","r":"Pretty low-key, which was honestly nice. How about yours?"},{"id":"c153","d":"smalltalk","t":"Days & seasons","s":"Someone says they had a packed weekend","r":"Sounds like a full weekend! Was it fun at least?"},{"id":"c154","d":"smalltalk","t":"Days & seasons","s":"It is Wednesday and everyone seems tired","r":"We're halfway there. How's your week holding up?"},{"id":"c155","d":"smalltalk","t":"Days & seasons","s":"It is Friday afternoon","r":"Almost at the finish line. Any plans this weekend?"},{"id":"c156","d":"smalltalk","t":"Days & seasons","s":"You return after a long holiday weekend","r":"Hope you had a good long weekend! Do anything fun?"},{"id":"c157","d":"smalltalk","t":"Days & seasons","s":"A coworker mentions holiday travel","r":"Oh nice, are you traveling to see family or just getting away?"},{"id":"c158","d":"smalltalk","t":"Days & seasons","s":"Someone says they have no weekend plans","r":"Honestly, sometimes those are the best weekends."},{"id":"c159","d":"smalltalk","t":"Days & seasons","s":"The weather has changed suddenly","r":"I wasn't expecting it to get this cold so quickly."},{"id":"c160","d":"smalltalk","t":"Days & seasons","s":"Someone mentions the first nice day in weeks","r":"It's nice to finally get some decent weather."},{"id":"c161","d":"smalltalk","t":"Days & seasons","s":"A coworker mentions an upcoming day off","r":"Nice, anything planned or just taking a break?"},{"id":"c100","d":"coffee","t":"Life outside work","s":"You ask about weekend plans","r":"Anything fun planned for the weekend?"},{"id":"c101","d":"coffee","t":"Life outside work","s":"Someone mentions a restaurant","r":"Oh nice, is it worth checking out?"},{"id":"c102","d":"coffee","t":"Life outside work","s":"Someone mentions a show","r":"I've heard good things about that. What do you think of it?"},{"id":"c103","d":"coffee","t":"Life outside work","s":"Someone mentions a hobby","r":"How did you get into that?"},{"id":"c104","d":"coffee","t":"Life outside work","s":"Someone mentions a trip","r":"That sounds fun! Was it your first time there?"},{"id":"c105","d":"coffee","t":"Life outside work","s":"You want to make a light joke about a hectic day","r":"I guess there's never a dull moment!"},{"id":"c106","d":"coffee","t":"Life outside work","s":"Someone asks about your weekend","r":"Nothing too crazy, just relaxed and caught up on a few things. How about you?"},{"id":"c107","d":"coffee","t":"Life outside work","s":"Someone says they have a big event coming up","r":"That sounds exciting. Are you looking forward to it?"},{"id":"c142","d":"coffee","t":"Coffee and lunch","s":"You are standing in a coffee line with someone you know","r":"Have you tried anything good here lately?"},{"id":"c143","d":"coffee","t":"Coffee and lunch","s":"You are sitting next to a colleague at lunch","r":"How's your week been outside of all the meetings?"},{"id":"c144","d":"coffee","t":"Coffee and lunch","s":"You want to join an open lunch table","r":"Mind if I sit here?"},{"id":"c145","d":"coffee","t":"Coffee and lunch","s":"You want to invite a coworker to grab coffee","r":"I'm heading down for coffee. Want to come along?"},{"id":"c146","d":"coffee","t":"Coffee and lunch","s":"Someone says they brought lunch from home","r":"Nice, that looks good. Do you usually meal prep?"},{"id":"c147","d":"coffee","t":"Coffee and lunch","s":"A coworker recommends a restaurant","r":"Oh nice, what do you usually order there?"},{"id":"c148","d":"coffee","t":"Coffee and lunch","s":"You want to leave a lunch conversation","r":"I'm going to head back, but it was great chatting with you."},{"id":"c149","d":"coffee","t":"Coffee and lunch","s":"Someone says they are trying a new cafe","r":"Let me know how it is. I'm always looking for new spots."},{"id":"c150","d":"coffee","t":"Coffee and lunch","s":"You see a coworker eating alone and want to be welcoming","r":"Hey, mind if I join you for a few minutes?"},{"id":"c151","d":"coffee","t":"Coffee and lunch","s":"You cannot join a lunch invitation","r":"Thanks for inviting me! I can't today, but I'd love to another time."},{"id":"c021","d":"listening","t":"Reactions","s":"Someone shares good news","r":"Oh nice, that's awesome!"},{"id":"c022","d":"listening","t":"Reactions","s":"Someone mentions a new opportunity","r":"That sounds like a great opportunity. How did it come about?"},{"id":"c023","d":"listening","t":"Reactions","s":"Someone says they are stressed","r":"That sounds like a lot to juggle. Hopefully things ease up soon."},{"id":"c024","d":"listening","t":"Reactions","s":"Someone explains a complex process","r":"That makes sense. Thanks for walking me through it."},{"id":"c025","d":"listening","t":"Reactions","s":"Someone makes a thoughtful point","r":"That's a really good way of putting it."},{"id":"c026","d":"listening","t":"Reactions","s":"Someone mentions an unfamiliar project","r":"That sounds interesting. What does it involve?"},{"id":"c027","d":"listening","t":"Reactions","s":"Someone tells you about a role change","r":"Oh nice! How has the transition been?"},{"id":"c028","d":"listening","t":"Reactions","s":"Someone has been at the company two years","r":"You've probably seen quite a bit of change since you started."},{"id":"c029","d":"listening","t":"Reactions","s":"You want to relate without hijacking the story","r":"I've noticed something similar on my side."},{"id":"c030","d":"listening","t":"Reactions","s":"You want them to elaborate","r":"What has that experience been like?"},{"id":"c031","d":"listening","t":"Reactions","s":"You want to ask why they chose a field","r":"How did you get interested in that area?"},{"id":"c032","d":"listening","t":"Reactions","s":"You want to move to a related topic","r":"That actually reminds me of something."},{"id":"c033","d":"listening","t":"Reactions","s":"A conversation slows","r":"Anyway, it was really good catching up!"},{"id":"c034","d":"listening","t":"Reactions","s":"Someone describes a frustrating delay","r":"I can see how that would be frustrating."},{"id":"c035","d":"listening","t":"Reactions","s":"Someone says their week is crazy","r":"Yeah, it seems like everyone is juggling a lot right now. What's been keeping you busy?"},{"id":"c162","d":"listening","t":"Active listening","s":"Someone tells you about a new responsibility","r":"That sounds like a good opportunity. What's been the biggest adjustment?"},{"id":"c163","d":"listening","t":"Active listening","s":"Someone describes a complicated process","r":"Got it. So the main handoff happens after the review step?"},{"id":"c164","d":"listening","t":"Active listening","s":"Someone shares an accomplishment","r":"That's great! What helped you get it across the finish line?"},{"id":"c165","d":"listening","t":"Active listening","s":"Someone is excited about a new tool","r":"Oh interesting. What do you like most about it so far?"},{"id":"c166","d":"listening","t":"Active listening","s":"Someone describes a frustrating meeting","r":"That sounds draining. Did you at least get clarity on next steps?"},{"id":"c167","d":"listening","t":"Active listening","s":"Someone is talking about a hobby you do not know","r":"I haven't tried that before. How did you get into it?"},{"id":"c168","d":"listening","t":"Active listening","s":"Someone talks about their weekend trip","r":"That sounds fun. What was the highlight?"},{"id":"c169","d":"listening","t":"Active listening","s":"Someone says their project got delayed","r":"Ah, that's frustrating. Is the timing clearer now?"},{"id":"c170","d":"listening","t":"Active listening","s":"Someone says they are learning something new","r":"That's cool. What's been the most useful thing you've picked up?"},{"id":"c171","d":"listening","t":"Active listening","s":"Someone pauses after sharing something personal","r":"That sounds important to you. Thanks for sharing it."},{"id":"c172","d":"listening","t":"Active listening","s":"Someone makes a point you agree with","r":"Exactly. I think the timing is a big part of it too."},{"id":"c173","d":"listening","t":"Active listening","s":"Someone makes a point you do not fully understand","r":"That's interesting. Could you give me an example?"},{"id":"c174","d":"personality","t":"Adding personality","s":"You want to share your own low-key weekend","r":"I mostly caught up on errands and got some downtime. It was needed."},{"id":"c175","d":"personality","t":"Adding personality","s":"You want to add a thought after someone discusses meetings","r":"I've noticed that too. It's harder to find uninterrupted focus time lately."},{"id":"c176","d":"personality","t":"Adding personality","s":"Someone says they love a TV show you have not seen","r":"I keep hearing about that one. What makes it worth watching?"},{"id":"c177","d":"personality","t":"Adding personality","s":"Someone recommends a hobby","r":"I've never done that, but it sounds like something I'd enjoy trying."},{"id":"c178","d":"personality","t":"Adding personality","s":"You want to share a light observation about your day","r":"My calendar looked manageable this morning, and then it filled up fast."},{"id":"c179","d":"personality","t":"Adding personality","s":"You want to connect over a shared challenge","r":"I've been working through something similar. The coordination piece is tricky."},{"id":"c180","d":"personality","t":"Adding personality","s":"You want to avoid one-word answers","r":"It's going well. I've been focused on a couple of reporting projects. How about you?"},{"id":"c181","d":"personality","t":"Adding personality","s":"Someone asks what you did over lunch","r":"I took a quick walk to reset. It's nice to step away from the screen."},{"id":"c182","d":"personality","t":"Adding personality","s":"You want to express genuine enthusiasm","r":"That's exactly the kind of work I'd love to learn more about."},{"id":"c183","d":"personality","t":"Adding personality","s":"You want to be friendly without oversharing","r":"Nothing too exciting, but it's been a good week overall."},{"id":"c210","d":"personality","t":"Humor and warmth","s":"Someone jokes about a packed calendar","r":"At this point my calendar is playing Tetris with itself."},{"id":"c211","d":"personality","t":"Humor and warmth","s":"Someone says the week feels long","r":"It's definitely earning its five days."},{"id":"c212","d":"personality","t":"Humor and warmth","s":"A coworker celebrates finishing a tough task","r":"That's a win. I'd absolutely count that as a reason to celebrate."},{"id":"c213","d":"personality","t":"Humor and warmth","s":"Someone says they need another coffee","r":"That sounds like a very reasonable business requirement."},{"id":"c214","d":"personality","t":"Humor and warmth","s":"Someone jokes about spreadsheet overload","r":"We're one workbook away from needing a workbook to track the workbooks."},{"id":"c215","d":"personality","t":"Humor and warmth","s":"Someone makes a joke you do not fully get","r":"Ha, I might need the context for that one."},{"id":"c216","d":"personality","t":"Humor and warmth","s":"Someone compliments your presentation","r":"Thank you! I appreciate that. I put a lot of thought into making it clear."},{"id":"c217","d":"personality","t":"Humor and warmth","s":"You want to make a low-pressure friendly comment","r":"It's nice to have a meeting that actually ends early."},{"id":"c218","d":"personality","t":"Humor and warmth","s":"Someone teases you lightly about always taking notes","r":"Guilty. Future me appreciates the documentation."},{"id":"c219","d":"personality","t":"Humor and warmth","s":"A joke might be at someone's expense","r":"I'd avoid that one; let's keep the jokes about the situation, not the person."},{"id":"c036","d":"groups","t":"Groups","s":"You want to join a group chat in person","r":"Mind if I join you?"},{"id":"c037","d":"groups","t":"Groups","s":"You missed the start of a group conversation","r":"Wait, what's the context here?"},{"id":"c038","d":"groups","t":"Groups","s":"You want to contribute without interrupting","r":"Building on that point, one thing I'd add is..."},{"id":"c039","d":"groups","t":"Groups","s":"You want a quiet colleague to contribute","r":"I'd be interested in your perspective too."},{"id":"c040","d":"groups","t":"Groups","s":"You want to ask someone about their career","r":"How did you end up on this team?"},{"id":"c041","d":"groups","t":"Groups","s":"You want to invite a colleague to coffee","r":"I'm heading to grab coffee. Want to join?"},{"id":"c042","d":"groups","t":"Groups","s":"You want to invite someone to lunch","r":"A few of us are grabbing lunch if you want to come."},{"id":"c043","d":"groups","t":"Groups","s":"You want to congratulate someone","r":"Congratulations! That's well deserved."},{"id":"c044","d":"groups","t":"Groups","s":"You want to compliment a presentation","r":"I liked how clearly you framed that recommendation."},{"id":"c045","d":"groups","t":"Groups","s":"You want to reconnect after an event","r":"It was great meeting you earlier. I enjoyed hearing about your team."},{"id":"c046","d":"groups","t":"Groups","s":"You want to leave a networking conversation","r":"I'll let you get back to it, but it was great meeting you."},{"id":"c184","d":"groups","t":"Joining groups","s":"You approach a group discussing a project you know","r":"I heard you mention the rollout. How's that going?"},{"id":"c185","d":"groups","t":"Joining groups","s":"You join a casual conversation mid-story","r":"Wait, I need the backstory on this one."},{"id":"c186","d":"groups","t":"Joining groups","s":"You want to join without interrupting","r":"Mind if I jump in for a second?"},{"id":"c187","d":"groups","t":"Joining groups","s":"You have relevant experience to add","r":"We ran into something similar on our side. One thing that helped was..."},{"id":"c188","d":"groups","t":"Joining groups","s":"You disagree with a group consensus","r":"I see the logic. Could there also be a downside to that approach?"},{"id":"c189","d":"groups","t":"Joining groups","s":"Two people are dominating the discussion","r":"I'd be curious to hear what others have seen as well."},{"id":"c190","d":"groups","t":"Joining groups","s":"You want to include a quieter teammate","r":"Sam, you've worked on this before. What's your take?"},{"id":"c191","d":"groups","t":"Joining groups","s":"You enter a group that is clearly having a private conversation","tip":"Smile and give them space; join at a more natural moment."},{"id":"c192","d":"groups","t":"Joining groups","s":"You need to exit a group chat at an event","r":"I'm going to say hello to a few others, but great meeting you all."},{"id":"c193","d":"groups","t":"Joining groups","s":"Someone invites you into a discussion","r":"Thanks! What are we debating?"},{"id":"c250","d":"groups","t":"Networking","s":"You want to reconnect after months of silence","r":"Hey, it's been a while! Hope things are going well on your end."},{"id":"c251","d":"groups","t":"Networking","s":"You meet someone at a company-wide event","r":"What team are you with, and what are you focused on lately?"},{"id":"c252","d":"groups","t":"Networking","s":"You want to ask about someone's career path","r":"How did you move from your previous role into this one?"},{"id":"c253","d":"groups","t":"Networking","s":"You want to learn about a different function","r":"I'd love to understand what a typical week looks like for your team."},{"id":"c254","d":"groups","t":"Networking","s":"You want to stay in touch after coffee","r":"Really enjoyed our conversation. I'd love to stay in touch."},{"id":"c255","d":"groups","t":"Networking","s":"You want to introduce two colleagues digitally","r":"Jordan, meet Sam. You both work on related reporting efforts, so I thought it might help to connect you."},{"id":"c256","d":"groups","t":"Networking","s":"You want to ask for a referral to the right person","r":"Is there someone you'd recommend I speak with to learn more about this area?"},{"id":"c257","d":"groups","t":"Networking","s":"You want to avoid sounding transactional","r":"I've been interested in the work your team does and would enjoy hearing about your experience."},{"id":"c258","d":"groups","t":"Networking","s":"Someone says they are too busy to connect","r":"Completely understand. Thanks for considering, and perhaps we can reconnect another time."},{"id":"c259","d":"groups","t":"Networking","s":"You want to follow up after an event","r":"Great meeting you at the event yesterday. I enjoyed our discussion about..."},{"id":"c260","d":"groups","t":"Networking","s":"You want to invite a newer teammate to lunch","r":"A few of us are heading to lunch. You're welcome to join if you'd like."},{"id":"c261","d":"groups","t":"Networking","s":"You want to congratulate someone on a promotion","r":"Congratulations on the promotion! That's great news and well deserved."},{"id":"c047","d":"meetings","t":"Meetings","s":"You join a meeting","r":"Hey everyone, good morning!"},{"id":"c048","d":"meetings","t":"Meetings","s":"You lead a meeting","r":"Thanks for joining. The goal today is to align on the next steps."},{"id":"c049","d":"meetings","t":"Meetings","s":"You give a status update","r":"At a high level, we have made good progress since our last discussion."},{"id":"c050","d":"meetings","t":"Meetings","s":"You want to highlight an issue","r":"One thing worth flagging is..."},{"id":"c051","d":"meetings","t":"Meetings","s":"You want to ask for clarification","r":"Just to make sure I'm following, are we saying that...?"},{"id":"c052","d":"meetings","t":"Meetings","s":"You want to ask a strategic question","r":"How are we thinking about that from a timeline perspective?"},{"id":"c053","d":"meetings","t":"Meetings","s":"You do not know the answer","r":"I want to confirm before I give you an answer. I can follow up."},{"id":"c054","d":"meetings","t":"Meetings","s":"You politely disagree","r":"I see the reasoning. One concern I'd flag is..."},{"id":"c055","d":"meetings","t":"Meetings","s":"You want to suggest an alternative","r":"Could we also consider another approach?"},{"id":"c056","d":"meetings","t":"Meetings","s":"You want to offer ownership","r":"I can take a first pass and share it with the group."},{"id":"c057","d":"meetings","t":"Meetings","s":"You want a director’s perspective","r":"Given your experience, how would you approach this?"},{"id":"c058","d":"meetings","t":"Meetings","s":"You receive feedback","r":"That's helpful feedback. I'll incorporate it."},{"id":"c059","d":"meetings","t":"Meetings","s":"You want to close a meeting","r":"Thanks, everyone. I'll send around a recap and next steps."},{"id":"c060","d":"meetings","t":"Meetings","s":"You want to finish a thought after interruption","r":"Absolutely. Just to finish that thought..."},{"id":"c061","d":"meetings","t":"Meetings","s":"You need an example to understand","r":"Could you give me an example of how that would work in practice?"},{"id":"c220","d":"meetings","t":"Meetings, advanced","s":"You want to contribute early in a meeting","r":"One thing I wanted to highlight before we get too far in is..."},{"id":"c221","d":"meetings","t":"Meetings, advanced","s":"You have a question but others are talking","r":"When there's a pause, I have a quick question about the timeline."},{"id":"c222","d":"meetings","t":"Meetings, advanced","s":"You are asked for an update unexpectedly","r":"Sure. At a high level, we're on track, and the main open item is..."},{"id":"c223","d":"meetings","t":"Meetings, advanced","s":"You need time to think after a question","r":"Good question. Let me think through that for a moment."},{"id":"c224","d":"meetings","t":"Meetings, advanced","s":"You need to clarify the meeting objective","r":"Before we dive in, can we align on the decision we're trying to make?"},{"id":"c225","d":"meetings","t":"Meetings, advanced","s":"The meeting is drifting off topic","r":"That may be worth a separate discussion. Could we return to the decision at hand?"},{"id":"c226","d":"meetings","t":"Meetings, advanced","s":"You want to summarize a long discussion","r":"Let me try to synthesize what I've heard so far."},{"id":"c227","d":"meetings","t":"Meetings, advanced","s":"You want to check for alignment","r":"Does that reflect everyone's understanding of the next steps?"},{"id":"c228","d":"meetings","t":"Meetings, advanced","s":"You are presenting a chart with a caveat","r":"One caveat before we interpret this trend is that the sample size is limited."},{"id":"c229","d":"meetings","t":"Meetings, advanced","s":"Someone challenges your conclusion","r":"That's a fair challenge. Here's the evidence behind my interpretation."},{"id":"c230","d":"meetings","t":"Meetings, advanced","s":"You need to admit a metric is not ready","r":"I don't want to overstate the result. We still need to validate the inputs."},{"id":"c231","d":"meetings","t":"Meetings, advanced","s":"You need to redirect a detailed technical question","r":"That's worth unpacking. I can take it offline and follow up with specifics."},{"id":"c232","d":"meetings","t":"Meetings, advanced","s":"You want to invite objections","r":"What concerns or alternative interpretations should we consider?"},{"id":"c233","d":"meetings","t":"Meetings, advanced","s":"You want to hand off to a colleague","r":"I'll pause there and hand it over to Jordan for the next section."},{"id":"c234","d":"meetings","t":"Meetings, advanced","s":"You need to close with owners and dates","r":"Before we wrap, let's confirm owners and target dates for each action."},{"id":"c235","d":"meetings","t":"Meetings, advanced","s":"You are late to a virtual meeting","r":"Apologies for joining late. I'll catch up on the context and jump in where useful."},{"id":"c236","d":"meetings","t":"Meetings, advanced","s":"You need to leave a meeting early","r":"I need to drop at the half hour, but I'll review the notes and follow up."},{"id":"c237","d":"meetings","t":"Meetings, advanced","s":"You are asked something outside your scope","r":"I haven't owned that workstream, but I can connect you with the right person."},{"id":"c238","d":"leaders","t":"Leadership interactions","s":"You see a director in the cafeteria","r":"Hi, good to see you. How's your week going?"},{"id":"c239","d":"leaders","t":"Leadership interactions","s":"A VP asks what you're working on","r":"I'm focused on improving the team's performance reporting, especially around..."},{"id":"c240","d":"leaders","t":"Leadership interactions","s":"A senior leader asks for the bottom line","r":"The short version is that we're seeing [trend], driven mainly by [factor]."},{"id":"c241","d":"leaders","t":"Leadership interactions","s":"You want to ask a leader a thoughtful question","r":"What's one priority you think teams should pay more attention to this quarter?"},{"id":"c242","d":"leaders","t":"Leadership interactions","s":"You want to mention their recent presentation","r":"I appreciated your point about prioritization in the town hall."},{"id":"c243","d":"leaders","t":"Leadership interactions","s":"You disagree with a leader respectfully","r":"I see the rationale. Could I share one risk we've noticed in the data?"},{"id":"c244","d":"leaders","t":"Leadership interactions","s":"A leader asks for a recommendation","r":"Based on what we've seen, I'd recommend [option] because [reason]."},{"id":"c245","d":"leaders","t":"Leadership interactions","s":"You want to request a brief coffee chat","r":"If you have 15 minutes sometime, I'd value hearing how you approach these decisions."},{"id":"c246","d":"leaders","t":"Leadership interactions","s":"A leader gives you advice","r":"That's helpful. I appreciate you taking the time to share that perspective."},{"id":"c247","d":"leaders","t":"Leadership interactions","s":"You need to decline an unrealistic deadline","r":"I can prioritize that, but to deliver it well we'd need to adjust [scope or timing]."},{"id":"c248","d":"leaders","t":"Leadership interactions","s":"You are asked to speak about an unfamiliar area","r":"I don't want to speculate. I can validate that with the owning team."},{"id":"c249","d":"leaders","t":"Leadership interactions","s":"You want to show interest in broader strategy","r":"How does this work connect to the team's longer-term priorities?"},{"id":"c328","d":"leaders","t":"Career and mentoring","s":"You want to ask a mentor for feedback","r":"What's one area you'd recommend I strengthen over the next few months?"},{"id":"c329","d":"leaders","t":"Career and mentoring","s":"You want to discuss growth with your manager","r":"I'd like to talk about the skills and experiences that would prepare me for the next level."},{"id":"c330","d":"leaders","t":"Career and mentoring","s":"You want to ask about a colleague's career","r":"What experiences helped you make that transition?"},{"id":"c331","d":"leaders","t":"Career and mentoring","s":"You want to volunteer for stretch work","r":"I'd be interested in taking on a stretch assignment if something relevant comes up."},{"id":"c332","d":"leaders","t":"Career and mentoring","s":"You want to ask to observe a senior meeting","r":"Would it be appropriate for me to sit in and learn from that discussion?"},{"id":"c333","d":"leaders","t":"Career and mentoring","s":"You want to ask for presentation opportunities","r":"I'd love to get more practice presenting. Are there opportunities to own a portion of an update?"},{"id":"c334","d":"leaders","t":"Career and mentoring","s":"You want to ask what success looks like","r":"What would strong performance look like for this responsibility?"},{"id":"c335","d":"leaders","t":"Career and mentoring","s":"You want to request candid feedback","r":"I'd appreciate candid feedback, including what I could do differently."},{"id":"c336","d":"leaders","t":"Career and mentoring","s":"You want to share a recent accomplishment","r":"I wanted to highlight a result from the project that I'm proud of: [specific outcome]."},{"id":"c337","d":"leaders","t":"Career and mentoring","s":"You want to ask about a role without implying you want to leave","r":"I'm interested in learning how different functions operate and what skills they value."},{"id":"c304","d":"presenting","t":"Remote and video calls","s":"You join a call with cameras off","r":"Hey everyone, good morning! Can you hear me okay?"},{"id":"c305","d":"presenting","t":"Remote and video calls","s":"Your microphone was muted","r":"Sorry, I was on mute. What I was saying was..."},{"id":"c306","d":"presenting","t":"Remote and video calls","s":"Your connection drops mid-sentence","r":"Sorry, I lost connection for a moment. Where did I cut out?"},{"id":"c307","d":"presenting","t":"Remote and video calls","s":"You want to speak but cannot find an opening","r":"Could I jump in with one quick point?"},{"id":"c308","d":"presenting","t":"Remote and video calls","s":"Someone's audio is breaking up","r":"You're breaking up a little. Would you mind repeating that last part?"},{"id":"c309","d":"presenting","t":"Remote and video calls","s":"You need to share your screen","r":"I'll share my screen so we can look at the numbers together."},{"id":"c310","d":"presenting","t":"Remote and video calls","s":"You need to confirm others can see a slide","r":"Can everyone see the dashboard on my screen?"},{"id":"c311","d":"presenting","t":"Remote and video calls","s":"You are presenting to people in multiple time zones","r":"Thanks for joining from different time zones. I appreciate it."},{"id":"c312","d":"presenting","t":"Remote and video calls","s":"Someone's child or pet appears briefly","r":"No worries at all. Happens to everyone working remotely."},{"id":"c313","d":"presenting","t":"Remote and video calls","s":"You want to avoid talking over a delayed speaker","r":"Go ahead, I think there's a slight delay on my end."},{"id":"c314","d":"presenting","t":"Remote and video calls","s":"You need to leave a call for another meeting","r":"I have to jump to another call. Thanks, everyone; I'll follow up on my items."},{"id":"c315","d":"presenting","t":"Remote and video calls","s":"You are joining a call where everyone knows each other","r":"Hey all, good to see everyone again."},{"id":"c316","d":"presenting","t":"Presentation and storytelling","s":"You need a clear opening line","r":"I'll start with the headline, then walk through the supporting data."},{"id":"c317","d":"presenting","t":"Presentation and storytelling","s":"You want to explain why the topic matters","r":"This matters because it affects [customer, risk, cost, or performance outcome]."},{"id":"c318","d":"presenting","t":"Presentation and storytelling","s":"You need to transition between slides","r":"With that context, let's look at what the data tells us."},{"id":"c319","d":"presenting","t":"Presentation and storytelling","s":"You need to call out a surprising trend","r":"One thing that stood out to us was the change in [metric]."},{"id":"c320","d":"presenting","t":"Presentation and storytelling","s":"You want to explain a complex chart simply","r":"The key thing to notice here is the difference between these two groups."},{"id":"c321","d":"presenting","t":"Presentation and storytelling","s":"You want to avoid overclaiming causation","r":"These patterns are correlated, but we haven't established causation."},{"id":"c322","d":"presenting","t":"Presentation and storytelling","s":"You want to handle a tough audience question","r":"That's an important question. Here's what we know and what we're still validating."},{"id":"c323","d":"presenting","t":"Presentation and storytelling","s":"You need to acknowledge limitations","r":"A limitation of this analysis is [limitation], so we should interpret the result cautiously."},{"id":"c324","d":"presenting","t":"Presentation and storytelling","s":"You need to make a recommendation","r":"Given the evidence, my recommendation is [action], with [risk] as the main consideration."},{"id":"c325","d":"presenting","t":"Presentation and storytelling","s":"You want to end with a strong takeaway","r":"If you remember one thing from this analysis, it's [main insight]."},{"id":"c326","d":"presenting","t":"Presentation and storytelling","s":"You need to ask for audience input","r":"I'd be interested in whether this matches what you're seeing operationally."},{"id":"c327","d":"presenting","t":"Presentation and storytelling","s":"You want to transition into questions","r":"I'll pause there. What questions or reactions do you have?"},{"id":"c062","d":"chat","t":"Teams chat","s":"You message a coworker with a question","r":"Hey! Quick question when you have a chance."},{"id":"c063","d":"chat","t":"Teams chat","s":"You ask for a document","r":"Would you mind sending that over when you have a moment?"},{"id":"c064","d":"chat","t":"Teams chat","s":"You want to ask who owns something","r":"Do you happen to know who owns this process?"},{"id":"c065","d":"chat","t":"Teams chat","s":"You acknowledge an update","r":"Got it, thanks for the heads-up!"},{"id":"c066","d":"chat","t":"Teams chat","s":"You acknowledge clarification","r":"Makes sense, thanks for clarifying."},{"id":"c067","d":"chat","t":"Teams chat","s":"You ask for a short call","r":"Would you have 10 to 15 minutes to sync sometime today?"},{"id":"c068","d":"chat","t":"Teams chat","s":"You offer a call instead of a long chat","r":"Happy to hop on a quick call if that's easier."},{"id":"c069","d":"chat","t":"Teams chat","s":"You offer help","r":"Happy to take a look if that would be useful."},{"id":"c070","d":"chat","t":"Teams chat","s":"You follow up without pressure","r":"Hey, checking back in to see if there are any updates."},{"id":"c071","d":"chat","t":"Teams chat","s":"You need input to move forward","r":"Let me know if there's anything you need from me to move this forward."},{"id":"c072","d":"chat","t":"Teams chat","s":"You thank someone for quick help","r":"Perfect, really appreciate the quick turnaround!"},{"id":"c073","d":"chat","t":"Teams chat","s":"You close a Teams conversation","r":"Thanks again! Have a great rest of your day."},{"id":"c074","d":"chat","t":"Teams chat","s":"You want to introduce yourself digitally","r":"Hey Jordan! I think we've been on a few of the same calls. I'm Alex from analytics and wanted to say hello."},{"id":"c277","d":"chat","t":"Teams chat, advanced","s":"You need to message someone you have never contacted","r":"Hi Jordan! I'm Alex from analytics. I'm reaching out about [topic]."},{"id":"c278","d":"chat","t":"Teams chat, advanced","s":"You need a quick answer but do not want to interrupt","r":"Hey! When you have a moment, could you confirm [specific detail]?"},{"id":"c279","d":"chat","t":"Teams chat, advanced","s":"You want to move a long chat to a call","r":"This may be easier to resolve live. Do you have ten minutes to talk?"},{"id":"c280","d":"chat","t":"Teams chat, advanced","s":"You are sending a file for review","r":"Sharing the latest draft here. Would appreciate any feedback by Thursday."},{"id":"c281","d":"chat","t":"Teams chat, advanced","s":"You need to follow up on a deadline","r":"Checking in on [item] since we're targeting Friday. Any updates?"},{"id":"c282","d":"chat","t":"Teams chat, advanced","s":"You want to acknowledge without implying approval","r":"Thanks for sharing. I'll review and come back with any questions."},{"id":"c283","d":"chat","t":"Teams chat, advanced","s":"You need to correct a typo or mistake","r":"Quick correction to my earlier note: I meant [correct detail]."},{"id":"c284","d":"chat","t":"Teams chat, advanced","s":"Someone messages while you are busy","r":"Thanks for reaching out. I'm tied up for the next hour but can look afterward."},{"id":"c285","d":"chat","t":"Teams chat, advanced","s":"You need to ask someone to clarify a vague message","r":"Could you share a bit more context on what you need from me?"},{"id":"c286","d":"chat","t":"Teams chat, advanced","s":"You want to follow up without sounding annoyed","r":"Circling back on this when you have a chance. Thanks!"},{"id":"c287","d":"chat","t":"Teams chat, advanced","s":"You want to send a friendly Friday sign-off","r":"Thanks again for the help this week. Enjoy your weekend!"},{"id":"c288","d":"chat","t":"Teams chat, advanced","s":"You want to ask whether a colleague has capacity","r":"Would you have bandwidth to help with [task] this week?"},{"id":"c289","d":"chat","t":"Teams chat, advanced","s":"You need to share bad news briefly","r":"Quick heads-up: [issue] may affect the timeline. I'm looking into options now."},{"id":"c290","d":"chat","t":"Teams chat, advanced","s":"You want to offer a specific next step","r":"I can draft a short summary and send it over this afternoon."},{"id":"c291","d":"chat","t":"Teams chat, advanced","s":"You want to politely end a chat thread","r":"Sounds good. Thanks for working through this with me!"},{"id":"c075","d":"email","t":"Email","s":"You open a professional email","r":"Hi Jordan, hope your week is going well."},{"id":"c076","d":"email","t":"Email","s":"You explain why you are emailing","r":"I wanted to reach out regarding [topic]."},{"id":"c077","d":"email","t":"Email","s":"You provide context for a request","r":"I am currently working on [project] and was hoping to get your input on [question]."},{"id":"c078","d":"email","t":"Email","s":"You ask for a review","r":"When you have a chance, would you mind reviewing the attached draft?"},{"id":"c079","d":"email","t":"Email","s":"You follow up on an unanswered email","r":"I wanted to follow up on my note below regarding [topic]."},{"id":"c080","d":"email","t":"Email","s":"You thank someone after a meeting","r":"Thanks again for taking the time to connect today. I appreciated your perspective on [topic]."},{"id":"c081","d":"email","t":"Email","s":"You send a project update","r":"We have completed [milestone] and are currently focused on [next step]."},{"id":"c082","d":"email","t":"Email","s":"You flag a dependency","r":"The main outstanding item is [dependency], which we are working through with [team]."},{"id":"c083","d":"email","t":"Email","s":"You close a request email","r":"Thanks in advance for your help. Best, [Name]"},{"id":"c084","d":"email","t":"Email","s":"You send a meeting recap","r":"As discussed, the next steps are [actions], with [owner] following up by [date]."},{"id":"c085","d":"email","t":"Email","s":"You request a networking chat","r":"If you have availability in the coming weeks, I would appreciate 15 to 20 minutes to learn about your experience."},{"id":"c086","d":"email","t":"Email","s":"You politely decline a request","r":"Given my current priorities, I would need to revisit the timing before committing."},{"id":"c087","d":"email","t":"Email","s":"You communicate uncertainty","r":"My initial understanding is [X], but I would like to validate that before confirming."},{"id":"c292","d":"email","t":"Email, advanced","s":"You are emailing a new cross-functional partner","r":"Hi [Name], I'm [Your Name] from [Team]. Looking forward to partnering on [initiative]."},{"id":"c293","d":"email","t":"Email, advanced","s":"You need a concise status update","r":"Quick update: [completed], [in progress], and [next step]. The main risk is [risk]."},{"id":"c294","d":"email","t":"Email, advanced","s":"You need to request a decision","r":"Could you confirm whether you'd prefer option A or B by [date] so we can proceed?"},{"id":"c295","d":"email","t":"Email, advanced","s":"You need to ask for a document","r":"Would you be able to share the latest version of [document] when convenient?"},{"id":"c296","d":"email","t":"Email, advanced","s":"You need to send a meeting recap","r":"Thanks for the discussion. Key decisions were [X]; action owners are [Y]; next check-in is [Z]."},{"id":"c297","d":"email","t":"Email, advanced","s":"You need to escalate a dependency","r":"We're currently blocked on [item]. Could you advise on the best path to resolution?"},{"id":"c298","d":"email","t":"Email, advanced","s":"You need to politely decline a request","r":"Thanks for thinking of me. I won't be able to take this on within the requested timeline."},{"id":"c299","d":"email","t":"Email, advanced","s":"You need to apologize for a delay","r":"Apologies for the delay. Here's the updated status and the revised expected timing."},{"id":"c300","d":"email","t":"Email, advanced","s":"You want to thank someone for detailed feedback","r":"Thank you for the thoughtful comments. I've incorporated them into the revised draft."},{"id":"c301","d":"email","t":"Email, advanced","s":"You want to close an email warmly","r":"Thanks again for your help, and hope you have a great rest of the week."},{"id":"c302","d":"email","t":"Email, advanced","s":"You want to make your email easier to act on","r":"The specific action I'm requesting is [action] by [date]."},{"id":"c303","d":"email","t":"Email, advanced","s":"You want to introduce two teams","r":"I'm connecting you both because your teams are working on related aspects of [initiative]."},{"id":"c088","d":"awkward","t":"Presence","s":"You accidentally interrupt","r":"Sorry, I didn't mean to cut you off. Go ahead."},{"id":"c089","d":"awkward","t":"Presence","s":"You did not hear someone","r":"Sorry, I missed that last part. Could you repeat it?"},{"id":"c090","d":"awkward","t":"Presence","s":"You need time to think","r":"That's a good question. Let me think through it for a moment."},{"id":"c091","d":"awkward","t":"Presence","s":"You made a mistake","r":"Thanks for catching that. I'll correct it."},{"id":"c092","d":"awkward","t":"Presence","s":"You need to leave","r":"I have to jump to another meeting, but it was great chatting."},{"id":"c093","d":"awkward","t":"Presence","s":"You want to sound more decisive","r":"One option I'd recommend is..."},{"id":"c094","d":"awkward","t":"Presence","s":"You want to share a considered opinion","r":"The way I'm thinking about it is..."},{"id":"c095","d":"awkward","t":"Presence","s":"You want to acknowledge a different view","r":"That's fair. I had been looking at it from a slightly different angle."},{"id":"c096","d":"awkward","t":"Presence","s":"You want to move to another topic","r":"Switching gears for a second..."},{"id":"c097","d":"awkward","t":"Presence","s":"You want to ask without apologizing","r":"I have a quick question about..."},{"id":"c098","d":"awkward","t":"Presence","s":"You want to check alignment","r":"Just to confirm, are we aligned on the next steps?"},{"id":"c099","d":"awkward","t":"Presence","s":"You want to end a hallway conversation","r":"Well, I'll let you get back to it. Good catching up!"},{"id":"c194","d":"awkward","t":"Awkward moments","s":"You accidentally call someone by the wrong name","r":"Sorry, Jordan, I mixed up the names. Thanks for correcting me."},{"id":"c195","d":"awkward","t":"Awkward moments","s":"You forget what you were saying","r":"I lost my train of thought for a second. Let me come back to it."},{"id":"c196","d":"awkward","t":"Awkward moments","s":"Your joke does not land","r":"Anyway, clearly my comedy career is on hold. Back to the topic."},{"id":"c197","d":"awkward","t":"Awkward moments","s":"You accidentally talk over someone","r":"Sorry, go ahead. I didn't mean to interrupt."},{"id":"c198","d
